<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Nossa Lista</title>
  <meta name="description" content="Lista de compras do casal, sincronizada entre os dois celulares.">
  <meta name="theme-color" content="#fbf4f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161013" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Nossa Lista">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root {
      --bg: #fbf4f7;
      --surface: #ffffff;
      --surface-2: #f6e9ef;
      --border: #eedbe3;
      --text: #2a1d23;
      --muted: #7c6871;
      --accent: #d63a72;
      --accent-strong: #b82c5f;
      --accent-soft: #fde3ed;
      --danger: #d64545;
      --warn: #d98b1c;
      --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
      --radius: 14px;
      --top: env(safe-area-inset-top, 0px);
      --bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161013;
        --surface: #221a1e;
        --surface-2: #2e2328;
        --border: #3b2e34;
        --text: #f5eef1;
        --muted: #a8949d;
        --accent: #e8558a;
        --accent-strong: #f27aa5;
        --accent-soft: #3d1f2c;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; overscroll-behavior-y: none;
    }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
    input, select, textarea {
      font: inherit; font-size: 16px; color: var(--text); background: var(--surface-2);
      border: 1px solid transparent; border-radius: 10px; padding: 11px 12px; width: 100%; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); background: var(--surface); }
    select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
    .oculto { display: none !important; }

    /* ---------- estrutura ---------- */
    header.topo {
      position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      padding: calc(var(--top) + 10px) 16px 10px; display: flex; align-items: center; gap: 10px;
    }
    header.topo h1 { font-size: 26px; font-weight: 750; margin: 0; flex: 1; letter-spacing: -.4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    header.topo.sub h1 { font-size: 20px; }
    .btn-icone { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow); flex: none; }
    .btn-icone svg { width: 20px; height: 20px; }
    .estado { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
    .estado.ok { background: var(--accent); }
    .estado.pendente { background: var(--warn); }
    .estado.erro { background: var(--danger); }
    main { padding: 4px 16px calc(var(--bottom) + 96px); max-width: 640px; margin: 0 auto; }
    body.com-rodape main { padding-bottom: calc(var(--bottom) + 170px); }

    nav.abas {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: space-around;
      background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border); padding: 6px 8px calc(var(--bottom) + 6px);
    }
    nav.abas button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); padding: 4px 0; }
    nav.abas button svg { width: 24px; height: 24px; }
    nav.abas button.ativa { color: var(--accent); font-weight: 600; }

    .cartao { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
    .titulo-secao { font-size: 13px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 22px 4px 8px; display: flex; justify-content: space-between; align-items: center; }
    .vazio { text-align: center; color: var(--muted); padding: 40px 20px; }
    .vazio .grande { font-size: 44px; margin-bottom: 6px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 16px; border-radius: 12px; font-weight: 600; background: var(--surface-2); }
    .btn.primario { background: var(--accent); color: #fff; }
    .btn.perigo { color: var(--danger); }
    .btn.largo { width: 100%; }
    .btn:disabled { opacity: .45; }

    /* ---------- listas ---------- */
    .listas { display: grid; gap: 10px; }
    .lista-card { display: flex; align-items: center; gap: 14px; padding: 14px; text-align: left; width: 100%; }
    .lista-card .emoji { font-size: 28px; width: 48px; height: 48px; border-radius: 12px; background: var(--accent-soft); display: grid; place-items: center; flex: none; }
    .lista-card .info { flex: 1; min-width: 0; }
    .lista-card .nome { font-weight: 650; font-size: 17px; }
    .lista-card .det { color: var(--muted); font-size: 14px; }
    .lista-card .seta { color: var(--muted); }

    /* ---------- lista aberta ---------- */
    .adicionar { position: sticky; top: calc(var(--top) + 58px); z-index: 15; padding: 2px 0 8px; background: var(--bg); }
    .adicionar form { display: flex; gap: 8px; }
    .adicionar input { background: var(--surface); box-shadow: var(--shadow); border-radius: 12px; padding: 13px 14px; }
    .adicionar .btn { padding: 0 16px; border-radius: 12px; }
    .sugestoes { position: absolute; left: 0; right: 0; top: 56px; background: var(--surface); border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.15); overflow: hidden; z-index: 16; }
    .sugestoes button { display: flex; width: 100%; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--border); text-align: left; }
    .sugestoes button:last-child { border-bottom: 0; }
    .sugestoes small { color: var(--muted); }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; padding: 7px 12px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); font-size: 14px; white-space: nowrap; }
    .chip b { color: var(--accent); font-weight: 700; margin-right: 2px; }

    .grupo { margin-top: 14px; }
    .grupo h3 { font-size: 13px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 0 4px 6px; }
    .itens { overflow: hidden; }
    .item { position: relative; overflow: hidden; border-bottom: 1px solid var(--border); }
    .item:last-child { border-bottom: 0; }
    .item .frente { position: relative; z-index: 1; display: flex; align-items: center; gap: 4px; min-height: 56px; background: var(--surface); touch-action: pan-y; will-change: transform; }
    .item .frente.solto { transition: transform .22s cubic-bezier(.2,.8,.2,1); }
    .item .fundo { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; gap: 8px; padding: 0 22px; color: #fff; font-weight: 650; font-size: 15px; white-space: nowrap; }
    .item .fundo svg { width: 22px; height: 22px; }
    .item .fundo.apagar { right: 0; left: 0; justify-content: flex-end; background: var(--danger); }
    .item .fundo.marcar { right: 0; left: 0; justify-content: flex-start; background: var(--accent); }
    .item .fundo.marcar.desfazer { background: var(--muted); }
    .item .fundo.oculto-fundo { visibility: hidden; }
    .item .check { width: 52px; align-self: stretch; display: grid; place-items: center; flex: none; }
    .item .check span { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border); display: grid; place-items: center; transition: background .15s, border-color .15s; }
    .item .check svg { width: 15px; height: 15px; color: #fff; opacity: 0; }
    .item.marcado .check span { background: var(--accent); border-color: var(--accent); }
    .item.marcado .check svg { opacity: 1; }
    .item .corpo { flex: 1; min-width: 0; padding: 9px 0; text-align: left; }
    .item .nome { font-weight: 550; overflow-wrap: anywhere; }
    .item .det { font-size: 13.5px; color: var(--muted); overflow-wrap: anywhere; }
    .item .valor { padding: 0 14px 0 6px; font-size: 14px; color: var(--muted); white-space: nowrap; text-align: right; }
    .item.marcado .nome { text-decoration: line-through; color: var(--muted); }
    .item.novo .frente { animation: brilho 1.2s ease; }
    @keyframes brilho { from { background: var(--accent-soft); } to { background: var(--surface); } }

    .rodape {
      position: fixed; left: 0; right: 0; bottom: calc(var(--bottom) + 58px); z-index: 25; padding: 0 12px 8px;
    }
    .rodape .cartao { max-width: 616px; margin: 0 auto; padding: 12px 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.12); }
    .rodape .totais { flex: 1; min-width: 0; }
    .rodape .totais b { font-size: 19px; display: block; }
    .rodape .totais small { color: var(--muted); font-size: 13px; }

    /* ---------- histórico ---------- */
    .mes { padding: 14px 16px; display: flex; justify-content: space-between; align-items: baseline; }
    .mes b { font-size: 20px; }
    .compra { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-bottom: 1px solid var(--border); width: 100%; text-align: left; }
    .compra:last-child { border-bottom: 0; }
    .compra .info { flex: 1; min-width: 0; }
    .compra .det { font-size: 13.5px; color: var(--muted); }
    .compra .total { font-weight: 650; }

    /* ---------- ajustes ---------- */
    .linha { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-bottom: 1px solid var(--border); }
    .linha:last-child { border-bottom: 0; }
    .linha .rot { flex: 1; min-width: 0; }
    .linha .rot small { display: block; color: var(--muted); font-size: 13px; }
    .linha .acoes { display: flex; gap: 4px; }
    .linha .acoes button { width: 34px; height: 34px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; }
    .linha .acoes button svg { width: 16px; height: 16px; }
    .chave { position: relative; width: 50px; height: 30px; flex: none; }
    .chave input { position: absolute; opacity: 0; inset: 0; margin: 0; width: 100%; height: 100%; z-index: 1; }
    .chave span { position: absolute; inset: 0; border-radius: 999px; background: var(--border); transition: background .2s; }
    .chave span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
    .chave input:checked + span { background: var(--accent); }
    .chave input:checked + span::after { transform: translateX(20px); }

    /* ---------- folha (bottom sheet) ---------- */
    .veu { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 50; opacity: 0; transition: opacity .2s; }
    .veu.aberto { opacity: 1; }
    .folha {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; background: var(--surface); border-radius: 20px 20px 0 0;
      padding: 0 16px calc(var(--bottom) + 16px); max-height: 90vh; overflow-y: auto;
      transform: translateY(100%); transition: transform .25s cubic-bezier(.2,.8,.2,1); max-width: 640px; margin: 0 auto;
    }
    .folha.aberta { transform: none; }
    /* topo fixo da folha: puxador no meio e X no canto, que continuam visíveis quando o conteúdo rola */
    .folha .folha-topo { position: sticky; top: 0; z-index: 5; height: 50px; margin: 0 -16px 2px; padding-top: 9px; background: var(--surface); border-radius: 20px 20px 0 0; display: flex; justify-content: center; }
    .folha .puxador { width: 40px; height: 5px; border-radius: 3px; background: var(--border); }
    .folha .folha-x { position: absolute; right: 12px; top: 7px; width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; }
    .folha .folha-x svg { width: 16px; height: 16px; }
    .folha h2 { font-size: 20px; margin: 4px 0 14px; }
    .campo { margin-bottom: 12px; }
    .campo label { display: block; font-size: 13px; color: var(--muted); margin: 0 2px 5px; font-weight: 600; }
    .dupla { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .qtd { display: flex; gap: 6px; }
    .qtd button { width: 44px; flex: none; border-radius: 10px; background: var(--surface-2); font-size: 22px; font-weight: 600; }
    .qtd input { text-align: center; }
    .botoes { display: flex; gap: 10px; margin-top: 16px; }
    .botoes .btn { flex: 1; }
    .emojis { display: flex; flex-wrap: wrap; gap: 6px; }
    .emojis button { width: 44px; height: 44px; border-radius: 10px; background: var(--surface-2); font-size: 22px; }
    .emojis button.sel { outline: 2px solid var(--accent); background: var(--accent-soft); }
    .lista-simples { margin: 0 0 6px; padding: 0; list-style: none; }
    .lista-simples li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--border); }
    .lista-simples li span:last-child { color: var(--muted); white-space: nowrap; }
    .menu button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 4px; border-bottom: 1px solid var(--border); text-align: left; font-size: 17px; }
    .menu button:last-child { border-bottom: 0; }
    .menu button.perigo { color: var(--danger); }

    /* ---------- toast ---------- */
    .toast {
      position: fixed; left: 50%; bottom: calc(var(--bottom) + 80px); transform: translate(-50%, 20px); z-index: 60;
      background: #2a1d23; color: #fff; padding: 11px 14px 11px 16px; border-radius: 12px; display: flex; gap: 14px; align-items: center;
      opacity: 0; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); font-size: 15px; pointer-events: none;
    }
    .toast.visivel { opacity: 1; transform: translate(-50%, 0); }
    .toast button { color: #ff9cc0; font-weight: 700; pointer-events: auto; }  /* só o "Desfazer" recebe toque */
    body.com-rodape .toast { bottom: calc(var(--bottom) + 150px); }

    /* ---------- login ---------- */
    .login { max-width: 380px; margin: 0 auto; padding: calc(var(--top) + 60px) 24px 40px; text-align: center; }
    .login img { width: 84px; height: 84px; border-radius: 20px; }
    .login h1 { margin: 14px 0 4px; }
    .login p { color: var(--muted); margin: 0 0 24px; }
    .login form { display: grid; gap: 10px; text-align: left; }
    .login .erro { color: var(--danger); font-size: 14px; min-height: 20px; }
    .login .link { color: var(--accent); margin-top: 18px; font-size: 15px; }

    /* ---------- v1.1: mercado, orçamento, fotos, código de barras ---------- */
    .btn-icone.ativo { background: var(--accent); color: #fff; }
    .faixa { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 12px; background: var(--accent-soft); margin: 4px 0 8px; font-size: 14.5px; }
    .faixa b { color: var(--accent-strong); }
    .faixa .btn { padding: 7px 12px; font-size: 14px; background: var(--surface); flex: none; }
    .orc { margin-top: 8px; }
    .orc .barra { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
    .orc .barra span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
    .orc .barra.estourou span { background: var(--danger); }
    .orc small { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12.5px; margin-top: 4px; }
    .orc-hist { padding: 0 16px 12px; }
    .orc-hist .orc { margin-top: 6px; }
    .item .ver-foto { flex: none; margin-left: -6px; }
    .item .foto { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; display: block; background: var(--surface-2); }
    .item .lapis { width: 44px; align-self: stretch; display: none; place-items: center; color: var(--muted); flex: none; }
    .item .lapis svg { width: 18px; height: 18px; }
    body.modo-mercado .item .frente { min-height: 66px; }
    body.modo-mercado .item .nome { font-size: 20px; }
    body.modo-mercado .item .det { font-size: 15px; }
    body.modo-mercado .item .check { width: 60px; }
    body.modo-mercado .item .check span { width: 32px; height: 32px; }
    body.modo-mercado .item .lapis { display: grid; }
    body.modo-mercado .item .valor { padding-right: 0; }
    body.modo-mercado .grupo h3 { font-size: 14px; }
    .foto-grande { width: 100%; max-height: 60vh; object-fit: contain; border-radius: 12px; background: var(--surface-2); display: block; }
    .foto-campo { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .foto-campo img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; }
    .foto-campo .btn { padding: 10px 14px; }
    .leitor-tela { position: fixed; inset: 0; z-index: 70; background: var(--surface); padding: calc(var(--top) + 14px) 16px calc(var(--bottom) + 16px); overflow-y: auto; }
    .leitor-tela h2 { font-size: 20px; margin: 4px 0 12px; }
    .leitor-tela form { display: flex; gap: 8px; margin-top: 12px; }
    .leitor { position: relative; border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 3 / 4; max-height: 56vh; margin: 0 auto; }
    .leitor video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .leitor .mira { position: absolute; left: 8%; right: 8%; top: 38%; height: 24%; border: 3px solid rgba(255,255,255,.9); border-radius: 12px; box-shadow: 0 0 0 999px rgba(0,0,0,.35); }
    /* editar compra feita (preços depois, em casa) */
    .cp-linha { padding: 10px 0; border-bottom: 1px solid var(--border); }
    .cp-linha:last-child { border-bottom: 0; }
    .cp-topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .cp-nome { font-weight: 600; overflow-wrap: anywhere; }
    .cp-x { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); flex: none; }
    .cp-x svg { width: 16px; height: 16px; }
    .cp-campos { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .cp-campos input { padding: 9px 10px; text-align: center; min-width: 0; }
    .cp-campos .cp-qtd { width: 72px; flex: none; }
    .cp-campos .cp-preco { flex: 1; }
    .cp-campos .cp-preco.falta { border-color: var(--accent); background: var(--accent-soft); }
    .cp-campos .cp-un, .cp-campos .cp-mult { color: var(--muted); font-size: 14px; flex: none; }
    .cp-campos .cp-val { min-width: 74px; text-align: right; font-weight: 600; font-size: 14.5px; flex: none; }
    .cp-total { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 2px 4px; font-size: 17px; }
    .cp-total small { color: var(--muted); font-size: 13px; }
    .adicionar .btn.lerc { padding: 0 12px; background: var(--surface); box-shadow: var(--shadow); color: var(--text); }
    .adicionar .btn.lerc svg { width: 24px; height: 24px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast"><span></span><button class="oculto"></button></div>

  <script>
  'use strict';
  /* =====================================================================
     Nossa Lista — lista de compras do casal (PWA para iPhone)
     Dados: gravados no aparelho (funciona sem sinal) e sincronizados pela nuvem Supabase.
     Cada registro tem "atualizado" (hora da última mudança); na nuvem vale o mais recente.
     Nada é apagado de verdade: o registro fica com apagado=true, para o outro celular saber.
     ===================================================================== */

  // Nuvem: preencher depois de criar o projeto Supabase (ver LEIA-ME). Vazio = só neste aparelho.

  const SUPA_KEY = 'sb_publishable_3q-hGxBzH9c5-CCWt235ng_56AtaAbh';  // chave pública (segura com as regras de acesso)

  const CATS_PADRAO = ['Hortifruti', 'Padaria', 'Açougue e peixaria', 'Frios e laticínios', 'Mercearia', 'Bebidas',
    'Congelados', 'Limpeza', 'Higiene e beleza', 'Bebê', 'Pet', 'Farmácia', 'Casa e utilidades', 'Outros'];
  const UNIDADES = ['un', 'kg', 'g', 'L', 'ml', 'pct', 'cx', 'dz', 'lata', 'garrafa'];
  const EMOJIS = ['🛒', '💊', '🏠', '🥩', '🥖', '🍎', '🧴', '🐶', '👶', '🎉', '🍷', '🧹', '🔧', '🎁', '📦', '❄️'];
  const COLECOES = ['listas', 'itens', 'compras', 'catalogo', 'config'];

  // Palpite de categoria pelo nome (só quando o item nunca foi comprado antes)
  const PALPITES = {
    'Hortifruti': 'alface tomate cebola alho batata cenoura banana maca maçã laranja limao limão mamao mamão abacate abacaxi melancia melao melão uva morango pera manga kiwi brocolis brócolis couve repolho pepino abobrinha abobora abóbora berinjela pimentao pimentão beterraba mandioca aipim inhame chuchu quiabo vagem salsinha cebolinha coentro hortela hortelã rucula rúcula espinafre gengibre ovos ovo verdura legume fruta',
    'Padaria': 'pao pão paes pães bisnaguinha bolo torrada broa croissant baguete rosca sonho',
    'Açougue e peixaria': 'carne frango peito coxa sobrecoxa asa file filé alcatra picanha patinho acem acém costela linguica linguiça bacon peixe tilapia tilápia salmao salmão camarao camarão moida moída bife lombo pernil calabresa hamburguer hambúrguer',

    'Mercearia': 'arroz feijao feijão macarrao macarrão oleo óleo azeite acucar açúcar sal cafe café farinha fuba fubá aveia granola biscoito bolacha molho extrato milho ervilha atum sardinha maionese ketchup mostarda vinagre tempero caldo achocolatado cereal gelatina leite-condensado chocolate pipoca amendoim castanha mel geleia',
    'Bebidas': 'agua água refrigerante coca suco cerveja vinho energetico energético cha chá guarana guaraná isotonico isotônico vodka whisky',
    'Congelados': 'sorvete pizza lasanha nuggets congelado gelo polpa batata-frita',
    'Limpeza': 'detergente sabao sabão amaciante desinfetante agua-sanitaria água-sanitária cloro esponja vassoura rodo pano saco-de-lixo lixo alcool álcool limpador multiuso lustra-moveis veja',
    'Higiene e beleza': 'papel-higienico papel-higiênico sabonete shampoo xampu condicionador creme-dental pasta-de-dente escova desodorante absorvente fio-dental cotonete algodao algodão barbeador lamina lâmina hidratante protetor',

    'Farmácia': 'remedio remédio dipirona paracetamol vitamina curativo band-aid termometro termômetro soro'
  };

  /* ---------- utilidades ---------- */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
  const moeda = (n) => (n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const numero = (s) => { if (s == null || s === '') return null; const n = parseFloat(String(s).replace(/\./g, (m, i, t) => (t.includes(',') ? '' : m)).replace(',', '.')); return isFinite(n) ? n : null; };
  const fmtNum = (n) => (n == null ? '' : n.toLocaleString('pt-BR', { maximumFractionDigits: 3 }));
  const dataCurta = (ms) => new Date(ms).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '');
  const nomeMes = (ms) => { const t = new Date(ms).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }); return t[0].toUpperCase() + t.slice(1); };

  const ICONE = {
    voltar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',

    lapis: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    lixo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></svg>',
    carrinho: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a1.5 1.5 0 001.5 1.2h8.4a1.5 1.5 0 001.5-1.1L21 8H6.2"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>',
    codigo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M16.5 8v8" stroke-width="1.8"/></svg>',
    abaListas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>',
    abaHist: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    abaAjustes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>'
  };

  /* ---------- dados (no aparelho) ---------- */
  const CHAVE = 'nossalista_v1';
  const Store = {
    dados: null, meta: null,
    vazio() { return { listas: {}, itens: {}, compras: {}, catalogo: {}, config: {} }; },
    carregar() {
      let salvo = null;
      try { salvo = JSON.parse(localStorage.getItem(CHAVE)); } catch (e) {}
      this.dados = Object.assign(this.vazio(), salvo && salvo.dados);
      this.meta = Object.assign({ nome: '', enviado: {}, cursor: null, pedirPreco: false, aberto: {} }, salvo && salvo.meta);
      // listas iniciais com id fixo: os dois celulares criam o mesmo registro, sem duplicar
      if (!this.dados.listas.mercado) this.dados.listas.mercado = { id: 'mercado', nome: 'Mercado', emoji: '🛒', ordem: 1, atualizado: 0 };
      if (!this.dados.listas.farmacia) this.dados.listas.farmacia = { id: 'farmacia', nome: 'Farmácia', emoji: '💊', ordem: 2, atualizado: 0 };
      if (!this.dados.config.cats) this.dados.config.cats = { id: 'cats', lista: CATS_PADRAO.slice(), atualizado: 0 };
    },
    salvar() {
      try { localStorage.setItem(CHAVE, JSON.stringify({ dados: this.dados, meta: this.meta })); }
      catch (e) { toast('Não foi possível gravar no aparelho'); }
    },
    // grava sempre um objeto novo (a sincronização compara pela hora "atualizado")
    put(col, obj) {
      const novo = Object.assign({}, obj, { atualizado: Math.max(Date.now(), (obj.atualizado || 0) + 1) });
      this.dados[col][novo.id] = novo;
      return novo;
    },
    concluir() { this.salvar(); Nuvem.agendar(); }
  };
  const D = () => Store.dados;
  const M = () => Store.meta;
  const ativos = (col) => Object.values(D()[col]).filter((x) => !x.apagado);
  const cats = () => D().config.cats.lista;
  const listasOrdenadas = () => ativos('listas').sort((a, b) => (a.ordem || 0) - (b.ordem || 0) || a.nome.localeCompare(b.nome));
  const itensDa = (lista) => ativos('itens').filter((i) => i.lista === lista);
  const meuNome = () => M().nome || (Nuvem.sessao && Nuvem.sessao.email ? Nuvem.sessao.email.split('@')[0] : '');

  function palpiteCategoria(nome) {
    const n = norm(nome);
    const cat = D().catalogo[n];
    if (cat && cat.cat) return cat.cat;
    const palavras = n.split(' ');
    // primeiro as expressões compostas ("leite condensado", "agua sanitaria"), depois as palavras soltas
    for (const composta of [true, false]) {
      for (const [c, lista] of Object.entries(PALPITES)) {
        for (const k of norm(lista).split(' ')) {
          if (k.includes('-') !== composta) continue;
          const achou = composta ? n.includes(k.replace(/-/g, ' ')) : palavras.includes(k) || palavras.includes(k + 's');
          if (achou) return cats().includes(c) ? c : 'Outros';
        }
      }
    }
    return 'Outros';
  }

  // Preço: em kg/L o preço é por kg/L; em g/ml também é por kg/L (convertido); nos outros, por unidade
  function rotuloPreco(un) { return un === 'g' || un === 'kg' ? 'Preço por kg' : un === 'ml' || un === 'L' ? 'Preço por litro' : 'Preço por ' + (un || 'un'); }
  function valorItem(i) {
    if (i.preco == null) return null;
    const q = i.qtd == null ? 1 : i.qtd;
    return i.un === 'g' || i.un === 'ml' ? (q / 1000) * i.preco : q * i.preco;
  }
  function detalheItem(i, comPor) {
    const partes = [];
    if (i.qtd != null) partes.push(fmtNum(i.qtd) + ' ' + (i.un || 'un'));
    if (i.obs) partes.push(i.obs);
    if (i.preco != null && (i.qtd != null && i.qtd !== 1 || i.un === 'g' || i.un === 'ml')) partes.push(moeda(i.preco) + '/' + (i.un === 'g' ? 'kg' : i.un === 'ml' ? 'L' : i.un || 'un'));
    if (comPor && i.por && i.por !== meuNome()) partes.push('por ' + i.por);
    return partes.join(' · ');
  }

  /* ---------- catálogo (histórico de produtos, para sugestões) ---------- */
  function lembrarProduto(item, comprou) {
    const id = norm(item.nome);
    if (!id) return;
    const atual = D().catalogo[id] || { id, nome: item.nome, vezes: 0, porLista: {} };
    const novo = Object.assign({}, atual, { nome: item.nome, cat: item.cat, un: item.un || atual.un });
    if (item.preco != null) novo.preco = item.preco;
    if (item.qtd != null) novo.qtd = item.qtd;
    if (item.foto !== undefined) novo.foto = item.foto;
    if (comprou) {
      novo.vezes = (atual.vezes || 0) + 1;
      novo.porLista = Object.assign({}, atual.porLista, { [item.lista]: ((atual.porLista || {})[item.lista] || 0) + 1 });
      novo.ultima = Date.now();
    }
    Store.put('catalogo', novo);
  }

  /* ---------- ações ---------- */
  function lerTextoItem(texto) {
    // "2 kg arroz", "3 leite", "arroz"
    const m = texto.trim().match(/^(\d+(?:[.,]\d+)?)\s*(kg|g|l|ml|un|pct|cx|dz|lata|latas|garrafa|garrafas)?\s+(.+)$/i);
    if (!m) return { nome: texto.trim() };
    let un = m[2] ? m[2].toLowerCase() : null;
    if (un === 'l') un = 'L';
    if (un === 'latas') un = 'lata';
    if (un === 'garrafas') un = 'garrafa';
    return { nome: m[3].trim(), qtd: numero(m[1]), un };
  }
  function capitalizar(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }

  function adicionarItem(listaId, texto) {
    const lido = lerTextoItem(texto);
    if (!lido.nome) return;
    const nome = capitalizar(lido.nome);
    const igual = itensDa(listaId).find((i) => norm(i.nome) === norm(nome));
    if (igual && !igual.marcado) {
      if (lido.qtd != null) { Store.put('itens', Object.assign({}, igual, { qtd: lido.qtd, un: lido.un || igual.un })); Store.concluir(); }
      destacar = igual.id; render(); toast(`${igual.nome} já está na lista`); return;
    }
    if (igual && igual.marcado) {
      Store.put('itens', Object.assign({}, igual, { marcado: false, qtd: lido.qtd != null ? lido.qtd : igual.qtd }));
      Store.concluir(); AvisoItens.anotar(listaId, igual.nome); destacar = igual.id; render(); return;
    }
    const cat = D().catalogo[norm(nome)];
    const item = {
      id: uid(), lista: listaId, nome: cat ? cat.nome : nome, cat: palpiteCategoria(nome),
      qtd: lido.qtd != null ? lido.qtd : null, un: lido.un || (cat && cat.un) || 'un',
      obs: '', preco: cat && cat.preco != null ? cat.preco : null, foto: (cat && cat.foto) || null,
      marcado: false, por: meuNome(), criado: Date.now()
    };
    Store.put('itens', item);
    lembrarProduto(item, false);
    Store.concluir();
    AvisoItens.anotar(listaId, item.nome);
    destacar = item.id;
    render();
    return item;
  }

  function alternarItem(id) {
    const i = D().itens[id];
    if (!i) return;
    const marcado = !i.marcado;
    Store.put('itens', Object.assign({}, i, { marcado, marcadoPor: marcado ? meuNome() : '' }));
    Store.concluir();
    render();
    if (marcado && M().pedirPreco) abrirPreco(id);
  }

  function apagarItem(id) {
    const antes = D().itens[id];
    Store.put('itens', Object.assign({}, antes, { apagado: true }));
    Store.concluir();
    render();
    toast(`${antes.nome} removido`, 'Desfazer', () => { Store.put('itens', Object.assign({}, D().itens[id], { apagado: false })); Store.concluir(); render(); });
  }

  function finalizarCompra(listaId) {
    const lista = D().listas[listaId];
    const marcados = itensDa(listaId).filter((i) => i.marcado);
    if (!marcados.length) return;
    const total = marcados.reduce((s, i) => s + (valorItem(i) || 0), 0);
    const compra = {
      id: uid(), lista: listaId, nomeLista: lista.nome, emoji: lista.emoji, data: Date.now(), por: meuNome(), total,
      itens: marcados.map((i) => ({ nome: i.nome, cat: i.cat, qtd: i.qtd, un: i.un, preco: i.preco, obs: i.obs }))
    };
    Store.put('compras', compra);
    for (const i of marcados) { lembrarProduto(i, true); Store.put('itens', Object.assign({}, i, { apagado: true })); }
    Store.concluir();
    Avisos.enviar('compra', `${meuNome() || 'Alguém'} finalizou a compra · ${moeda(total)}`,
      `${lista.emoji || ''} ${lista.nome} · ${marcados.length} ${marcados.length === 1 ? 'item' : 'itens'}`, listaId);
    if (euNoMercado()) sairMercado(true);
    render();
    toast(`Compra guardada no histórico · ${moeda(total)}`);
  }

  function repetirCompra(compraId, listaId, itensBase) {
    const c = D().compras[compraId];
    const na = itensDa(listaId);
    let n = 0;
    for (const it of itensBase || c.itens) {
      const igual = na.find((i) => norm(i.nome) === norm(it.nome));
      if (igual && !igual.marcado) continue;
      if (igual) { Store.put('itens', Object.assign({}, igual, { marcado: false })); n++; continue; }
      Store.put('itens', { id: uid(), lista: listaId, nome: it.nome, cat: cats().includes(it.cat) ? it.cat : palpiteCategoria(it.nome), qtd: it.qtd, un: it.un || 'un', obs: it.obs || '', preco: it.preco, marcado: false, por: meuNome(), criado: Date.now() });
      n++;
    }
    Store.concluir();
    return n;
  }

  function textoDaLista(listaId) {
    const lista = D().listas[listaId];
    const itens = itensDa(listaId).filter((i) => !i.marcado);
    let t = `${lista.emoji || ''} ${lista.nome}\n`;
    for (const c of ordemCats(itens)) {
      t += `\n*${c}*\n`;
      for (const i of itens.filter((x) => x.cat === c)) t += `• ${i.nome}${i.qtd != null ? ' — ' + fmtNum(i.qtd) + ' ' + i.un : ''}${i.obs ? ' (' + i.obs + ')' : ''}\n`;
    }
    return t.trim();
  }
  function ordemCats(itens) {
    const usadas = [...new Set(itens.map((i) => i.cat || 'Outros'))];
    const ordem = cats();
    return usadas.sort((a, b) => (ordem.indexOf(a) + 1 || 999) - (ordem.indexOf(b) + 1 || 999) || a.localeCompare(b));
  }

  /* ---------- nuvem (Supabase) ---------- */
  const Nuvem = {
    sessao: null, rodando: false, deNovo: false, timer: null, estado: 'local', erro: '', membroOk: false,
    configurada() { return !!SUPA_URL && !!SUPA_KEY; },
    ativa() { return this.configurada() && !!this.sessao && !this.sessao.expirada; },
    carregar() { try { this.sessao = JSON.parse(localStorage.getItem('nossalista_sessao')); } catch (e) { this.sessao = null; } },
    guardar() { try { localStorage.setItem('nossalista_sessao', JSON.stringify(this.sessao)); } catch (e) {} },
    precisaLogin() {
      if (!this.configurada()) return false;
      let local = false;
      try { local = localStorage.getItem('nossalista_modo') === 'local'; } catch (e) {}
      return this.sessao ? !!this.sessao.expirada : !local;
    },
    sair() {
      this.sessao = null; this.membroOk = false; this.guardar();
      M().enviado = {}; M().cursor = null; Store.salvar();
    },
    async auth(corpo, tipo) {
      const r = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=${tipo}`, { method: 'POST', headers: { apikey: SUPA_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { const e = new Error(d.error_description || d.msg || d.message || 'Falha no login'); e.status = r.status; throw e; }
      this.sessao = { token: d.access_token, refresh: d.refresh_token, expira: Date.now() + d.expires_in * 1000, email: (d.user && d.user.email) || (this.sessao && this.sessao.email) };
      this.guardar();
    },
    async token() {
      if (Date.now() > this.sessao.expira - 60000) {
        try { await this.auth({ refresh_token: this.sessao.refresh }, 'refresh_token'); }
        catch (e) { if (e.status === 400 || e.status === 401 || e.status === 403) { this.sessao.expirada = true; this.guardar(); } throw e; }
      }
      return this.sessao.token;
    },
    async api(caminho, opt = {}) {
      const r = await fetch(`${SUPA_URL}/rest/v1/${caminho}`, Object.assign({}, opt, {
        headers: Object.assign({ apikey: SUPA_KEY, Authorization: 'Bearer ' + await this.token(), 'Content-Type': 'application/json' }, opt.headers || {})
      }));
      if (!r.ok) { const e = new Error(`${r.status} ${(await r.text()).slice(0, 200)}`); e.status = r.status; throw e; }
      const txt = await r.text();
      return txt ? JSON.parse(txt) : null;
    },
    pendentes() {
      const env = M().enviado, lista = [];
      for (const col of COLECOES) for (const obj of Object.values(D()[col])) if (env[col + ':' + obj.id] !== (obj.atualizado || 0)) lista.push([col, obj]);
      return lista;
    },
    receber(l) {
      const col = l.colecao;
      if (!D()[col]) return false;
      const k = col + ':' + l.id, local = D()[col][l.id], tl = local ? local.atualizado || 0 : -1, tr = l.atualizado || 0;
      if (tl > tr) return false;            // a mudança daqui é mais nova: vai subir no próximo envio
      M().enviado[k] = tr;
      if (tl === tr) return false;
      D()[col][l.id] = l.dados;
      return true;
    },
    agendar(ms = 600) {
      if (!this.ativa()) return;
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.sincronizar(), ms);
    },
    async sincronizar() {
      if (!this.ativa()) return;
      if (this.rodando) { this.deNovo = true; return; }
      if (!navigator.onLine) { this.estado = 'offline'; mostrarEstado(); return; }
      this.rodando = true;
      let chegou = false;
      try {
        if (!this.membroOk) {
          const r = await this.api('lc_membros?select=user_id');
          if (!r || !r.length) { this.estado = 'erro'; this.erro = 'Este login ainda não foi liberado na nuvem (rodar o script 02 do LEIA-ME).'; return; }
          this.membroOk = true;
        }
        // 1) envia o que mudou aqui
        const pend = this.pendentes();
        for (let i = 0; i < pend.length; i += 500) {
          const lote = pend.slice(i, i + 500);
          await this.api('lc_dados?on_conflict=colecao,id', {
            method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
            body: JSON.stringify(lote.map(([col, o]) => ({ colecao: col, id: o.id, dados: o, atualizado: o.atualizado || 0 })))
          });
          for (const [col, o] of lote) M().enviado[col + ':' + o.id] = o.atualizado || 0;
        }
        // 2) recebe o que mudou na nuvem (com 2 min de folga, para não perder gravações simultâneas)
        let cursor = M().cursor, maior = cursor;
        const filtro = cursor ? '&sinc_em=gte.' + encodeURIComponent(new Date(Date.parse(cursor) - 120000).toISOString()) : '';
        for (let off = 0; ; off += 1000) {
          const linhas = await this.api(`lc_dados?select=colecao,id,dados,atualizado,sinc_em${filtro}&order=sinc_em.asc,id.asc&limit=1000&offset=${off}`);
          for (const l of linhas) {
            if (this.receber(l)) chegou = true;
            if (!maior || Date.parse(l.sinc_em) > Date.parse(maior)) maior = l.sinc_em;
          }
          if (linhas.length < 1000) break;
        }
        M().cursor = maior;
        Store.salvar();
        // 3) fotos tiradas aqui e avisos que ficaram na fila (falha aqui não derruba a sincronização)
        if (Object.keys(M().fotosPend || {}).length) await Fotos.enviarPendentes().catch(() => {});
        if ((M().avisosFila || []).length) Avisos.despachar().catch(() => {});
        this.estado = this.pendentes().length ? 'pendente' : 'ok';
        this.erro = '';
      } catch (e) {
        this.estado = e instanceof TypeError ? 'offline' : 'erro';
        this.erro = this.sessao && this.sessao.expirada ? 'Sessão expirada: entre de novo.' : e.message;
      } finally {
        this.rodando = false;
        if (chegou) render(true);
        mostrarEstado();
        if (this.deNovo) { this.deNovo = false; this.agendar(200); }
      }
    }
  };

  /* ---------- "Estou no mercado" + modo mercado ----------
     Cada pessoa tem um registro em config ("nomercado:<email>") que o outro celular recebe pela sincronização.
     Vale por até 3 h; termina ao tocar em "Saí" ou ao finalizar a compra. */
  const LIMITE_MERCADO = 3 * 3600 * 1000;
  const idMercado = () => 'nomercado:' + norm((Nuvem.sessao && Nuvem.sessao.email) || 'este-aparelho');
  const nomeLista = (id) => (D().listas[id] ? D().listas[id].nome : 'mercado');
  const hora = (ms) => new Date(ms).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const noMercadoAgora = (r) => r && !r.apagado && r.ativo && Date.now() - r.desde < LIMITE_MERCADO;
  const quemNoMercado = () => Object.values(D().config).filter((c) => c.id.startsWith('nomercado:') && noMercadoAgora(c));
  const euNoMercado = () => (noMercadoAgora(D().config[idMercado()]) ? D().config[idMercado()] : null);
  const outroNoMercado = () => quemNoMercado().some((r) => r.id !== idMercado());

  function entrarMercado(listaId, avisar) {
    Store.put('config', { id: idMercado(), ativo: true, quem: meuNome(), lista: listaId, desde: Date.now() });
    Store.concluir();
    M().modoMercado = true; Store.salvar();
    if (avisar) Avisos.enviar('mercado', `${meuNome() || 'Alguém'} está no ${nomeLista(listaId)} 🛒`, 'Precisa de mais alguma coisa? Adicione agora na lista.', listaId);
    render();
  }
  function sairMercado(semRender) {
    const r = D().config[idMercado()];
    if (r && r.ativo) { Store.put('config', Object.assign({}, r, { ativo: false })); Store.concluir(); }
    M().modoMercado = false; Store.salvar();
    if (!semRender) render();
  }
  function faixasHtml() {
    const eu = euNoMercado();
    let h = eu ? `<div class="faixa">🛒 <span style="flex:1">Você está no <b>${esc(nomeLista(eu.lista))}</b>. Toque no item para marcar.</span><button class="btn" data-acao="sair-mercado">Saí</button></div>` : '';
    for (const r of quemNoMercado().filter((x) => x.id !== idMercado()))
      h += `<div class="faixa">🛒 <span><b>${esc(r.quem || 'Alguém')}</b> está no ${esc(nomeLista(r.lista))} desde ${hora(r.desde)}. O que você adicionar chega na hora.</span></div>`;
    return h;
  }
  // tela sempre acesa (Wake Lock) enquanto o modo mercado estiver ligado e a lista aberta
  let travaTela = null;
  async function aplicarModoMercado() {
    if (M().modoMercado && !euNoMercado()) { M().modoMercado = false; Store.salvar(); }
    const ligado = !!M().modoMercado && tela === 'lista';
    document.body.classList.toggle('modo-mercado', ligado);
    try {
      if (ligado && !travaTela && 'wakeLock' in navigator && document.visibilityState === 'visible') {
        travaTela = await navigator.wakeLock.request('screen');
        travaTela.addEventListener('release', () => { travaTela = null; });
      }
      if (!ligado && travaTela) { const t = travaTela; travaTela = null; await t.release(); }
    } catch (e) { /* sem suporte: segue sem manter a tela acesa */ }
  }
  function abrirIrMercado() {
    if (euNoMercado()) return confirmar('Saiu do mercado?', 'Desliga o modo mercado e o aviso de que você está lá.', 'Saí do mercado', () => sairMercado(), false);
    const podeAvisar = Nuvem.configurada() && !!Nuvem.sessao;
    abrirFolha(`<h2>🛒 Estou no mercado</h2>
      <p style="color:var(--muted);margin-top:-6px">Liga o modo mercado: letras grandes, tela sempre acesa e um toque no item já marca.</p>
      ${podeAvisar ? `<div class="linha" style="padding:12px 2px;border:0"><div class="rot">Avisar o outro celular<small>Para lembrarem do que falta enquanto você está lá</small></div>
        <label class="chave"><input type="checkbox" id="fm-avisar" checked><span></span></label></div>` : ''}
      <div class="botoes"><button class="btn" data-f="nao">Cancelar</button><button class="btn primario" data-f="sim">Começar</button></div>`, (f) => {
      $('[data-f=nao]', f).onclick = () => fecharFolha();
      $('[data-f=sim]', f).onclick = () => { const av = $('#fm-avisar', f); fecharFolha(); entrarMercado(listaAtual, !!(av && av.checked)); };
    });
  }

  /* ---------- orçamento do mês (por lista) ---------- */
  function gastoNoMes(listaId, ref = Date.now()) {
    const r = new Date(ref);
    return ativos('compras').filter((c) => {
      const d = new Date(c.data);
      return c.lista === listaId && d.getMonth() === r.getMonth() && d.getFullYear() === r.getFullYear();
    }).reduce((s, c) => s + (c.total || 0), 0);
  }
  function orcHtml(l, ref) {
    if (!l.orcamento) return '';
    const g = gastoNoMes(l.id, ref), pct = Math.min(100, (g / l.orcamento) * 100);
    const mes = new Date(ref || Date.now()).toLocaleDateString('pt-BR', { month: 'long' });
    return `<div class="orc"><div class="barra${g > l.orcamento ? ' estourou' : ''}"><span style="width:${pct.toFixed(1)}%"></span></div>
      <small><span>${moeda(g)} de ${moeda(l.orcamento)} em ${esc(mes)}</span><span>${g > l.orcamento ? 'passou ' + moeda(g - l.orcamento) : 'resta ' + moeda(l.orcamento - g)}</span></small></div>`;
  }

  /* ---------- avisos no celular (Web Push pela função nl-avisar) ---------- */
  const Avisos = {
    erro: '',
    suportado() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; },
    instalado() { return navigator.standalone === true || matchMedia('(display-mode: standalone)').matches; },
    prefs() { return Object.assign({ itens: true, compra: true, mercado: true }, M().avisoPrefs); },
    chave() {
      const b = atob(VAPID_PUBLICA.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - (VAPID_PUBLICA.length % 4)) % 4));
      return Uint8Array.from(b, (c) => c.charCodeAt(0));
    },
    async inscricao() {
      if (!this.suportado()) return null;
      const reg = await navigator.serviceWorker.ready;
      return reg.pushManager.getSubscription();
    },
    async ativar() {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') throw new Error('Permissão negada. Libere em Ajustes do iPhone › Notificações › Nossa Lista.');
      const reg = await navigator.serviceWorker.ready;
      const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: this.chave() }));
      await this.registrar(sub);
    },
    // cadastra (ou atualiza nome/preferências) deste celular na nuvem
    async registrar(sub) {
      sub = sub || (await this.inscricao());
      if (!sub || !Nuvem.ativa()) return;
      await Nuvem.api('lc_push?on_conflict=endpoint', {
        method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify({ endpoint: sub.endpoint, assinatura: sub.toJSON(), nome: meuNome(), prefs: this.prefs(), atualizado_em: new Date().toISOString() })
      });
    },
    async desligar() {
      const sub = await this.inscricao();
      if (!sub) return;
      try { await Nuvem.api('lc_push?endpoint=eq.' + encodeURIComponent(sub.endpoint), { method: 'DELETE' }); } catch (e) {}
      await sub.unsubscribe();
    },
    enfileirar(tipo, titulo, corpo, listaId) {
      if (!Nuvem.configurada() || !Nuvem.sessao) return;
      M().avisosFila = (M().avisosFila || []).concat([{ tipo, titulo, corpo, url: listaId ? '?lista=' + listaId : '', tag: tipo + '-' + (listaId || ''), em: Date.now() }]).slice(-20);
      Store.salvar();
    },
    enviar(tipo, titulo, corpo, listaId) { this.enfileirar(tipo, titulo, corpo, listaId); this.despachar().catch(() => {}); },
    chamar(corpo, keepalive) {
      return Nuvem.token().then((tk) => fetch(`${SUPA_URL}/functions/v1/nl-avisar`, {
        method: 'POST', keepalive: !!keepalive,
        headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + tk, 'Content-Type': 'application/json' }, body: JSON.stringify(corpo)
      }));
    },
    // manda a fila; sem internet, fica para a próxima sincronização (aviso com mais de 30 min é descartado)
    async despachar(keepalive) {
      if (this.enviando) return;
      M().avisosFila = (M().avisosFila || []).filter((a) => Date.now() - a.em < 30 * 60 * 1000);
      if (!M().avisosFila.length || !Nuvem.ativa() || !navigator.onLine) return;
      this.enviando = true;
      try {
        while (M().avisosFila.length) {
          const r = await this.chamar(M().avisosFila[0], keepalive);
          M().avisosFila.shift(); Store.salvar();
          this.erro = r.ok ? '' : `aviso não enviado (${r.status})`;
        }
      } finally { this.enviando = false; }
    }
  };

  // Itens adicionados viram UM aviso: espera 45 s sem novidades (4 s se o outro está no mercado)
  // ou sai na hora em que o app é fechado
  const AvisoItens = {
    timer: null,
    anotar(listaId, nome) {
      if (!Nuvem.configurada() || !Nuvem.sessao) return;
      const p = (M().avisoItens = M().avisoItens || {});
      (p[listaId] = p[listaId] || []).push(nome);
      Store.salvar();
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.soltar(), outroNoMercado() ? 4000 : 45000);
    },
    soltar(keepalive) {
      clearTimeout(this.timer);
      const p = M().avisoItens || {};
      M().avisoItens = {};
      for (const [lid, nomes] of Object.entries(p)) {
        const l = D().listas[lid], unicos = [...new Set(nomes)];
        if (!l || !unicos.length) continue;
        const quem = meuNome() || 'Alguém';
        Avisos.enfileirar('itens', unicos.length === 1 ? `${quem} adicionou ${unicos[0]}` : `${quem} adicionou ${unicos.length} itens`,
          `${l.emoji || ''} ${l.nome}: ${unicos.slice(0, 6).join(', ')}${unicos.length > 6 ? '…' : ''}`, lid);
      }
      Store.salvar();
      Avisos.despachar(keepalive).catch(() => {});
    }
  };

  async function atualizarAvisosUI() {
    const el = $('#avisos');
    if (!el) return;
    const msg = (t) => `<div class="linha"><div class="rot" style="color:var(--muted);font-size:15px">${t}</div></div>`;
    if (!Nuvem.configurada() || !Nuvem.sessao) { el.innerHTML = msg('Entre na conta para receber avisos.'); return; }
    if (!Avisos.suportado()) {
      el.innerHTML = msg(Avisos.instalado() ? 'Este iPhone não recebe avisos (precisa do iOS 16.4 ou mais novo).'
        : 'Para receber avisos, instale o app: no Safari, <b>Compartilhar › Adicionar à Tela de Início</b>, e abra pelo ícone.');
      return;
    }
    if (Notification.permission === 'denied') { el.innerHTML = msg('Avisos bloqueados. Libere em <b>Ajustes do iPhone › Notificações › Nossa Lista</b>.'); return; }
    const sub = await Avisos.inscricao().catch(() => null);
    if (!$('#avisos')) return;
    if (!sub) {
      el.innerHTML = `<div class="linha"><div class="rot">Avise quando o outro mexer na lista<small>Itens novos, compra finalizada e quando alguém chega ao mercado</small></div></div>
        <div class="linha"><button class="btn primario largo" data-acao="ativar-avisos">Ativar avisos</button></div>`;
      return;
    }
    const p = Avisos.prefs();
    const chave = (k, rot, sub2) => `<div class="linha"><div class="rot">${rot}<small>${sub2}</small></div><label class="chave"><input type="checkbox" data-pref="${k}" ${p[k] ? 'checked' : ''}><span></span></label></div>`;
    el.innerHTML = chave('itens', 'Itens adicionados', 'Ex.: “Ana adicionou 3 itens no Mercado”') +
      chave('compra', 'Compra finalizada', 'Com o total da compra') +
      chave('mercado', 'Chegou ao mercado', 'Quando o outro toca em “Estou no mercado”') +
      `<div class="linha" style="gap:8px"><button class="btn" style="flex:1" data-acao="testar-avisos">Enviar teste</button><button class="btn perigo" style="flex:1" data-acao="desligar-avisos">Desligar</button></div>`;
  }

  /* ---------- fotos dos itens ----------
     Ficam no aparelho (Cache Storage) e sobem para a pasta privada lc-fotos do Supabase. */
  const Fotos = {
    urls: {}, erro: '',
    abrir() { return caches.open('nossalista-fotos'); },
    chave(p) { return new URL('fotos/' + p, location.href).href; },
    async guardar(p, blob) { const c = await this.abrir(); await c.put(this.chave(p), new Response(blob, { headers: { 'Content-Type': 'image/jpeg' } })); },
    async nova(arquivo) {
      const blob = await comprimirFoto(arquivo);
      const p = uid() + '.jpg';
      await this.guardar(p, blob);
      this.urls[p] = URL.createObjectURL(blob);
      M().fotosPend = Object.assign({}, M().fotosPend, { [p]: 1 });
      Store.salvar(); Nuvem.agendar();
      return p;
    },
    async url(p) {
      if (this.urls[p]) return this.urls[p];
      try {
        const c = await this.abrir();
        let r = await c.match(this.chave(p));
        if (!r && Nuvem.ativa() && navigator.onLine) {
          const resp = await fetch(`${SUPA_URL}/storage/v1/object/authenticated/lc-fotos/${encodeURIComponent(p)}`, { headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + (await Nuvem.token()) } });
          if (resp.ok) { const b = await resp.blob(); await this.guardar(p, b); return (this.urls[p] = URL.createObjectURL(b)); }
        }
        if (!r) return null;
        return (this.urls[p] = URL.createObjectURL(await r.blob()));
      } catch (e) { return null; }
    },
    async enviarPendentes() {
      const pend = Object.assign({}, M().fotosPend);
      const c = await this.abrir();
      for (const p of Object.keys(pend)) {
        const r = await c.match(this.chave(p));
        if (!r) { delete pend[p]; continue; }
        const resp = await fetch(`${SUPA_URL}/storage/v1/object/lc-fotos/${encodeURIComponent(p)}`, {
          method: 'POST', headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + (await Nuvem.token()), 'Content-Type': 'image/jpeg', 'x-upsert': 'true' }, body: await r.blob()
        });
        if (resp.ok) { delete pend[p]; this.erro = ''; }
        else { this.erro = (await resp.text()).slice(0, 120); break; }
      }
      M().fotosPend = pend; Store.salvar();
    }
  };
  async function comprimirFoto(arquivo) {
    const url = URL.createObjectURL(arquivo);
    try {
      const img = new Image();
      await new Promise((ok, erro) => { img.onload = ok; img.onerror = erro; img.src = url; });
      const k = Math.min(1, 1000 / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const blob = await new Promise((ok) => cv.toBlob(ok, 'image/jpeg', 0.78));
      if (!blob) throw new Error('foto');
      return blob;
    } finally { URL.revokeObjectURL(url); }
  }
  function pintarFotos(raiz) {
    $$('img[data-foto]', raiz).forEach((img) => { if (!img.src) Fotos.url(img.dataset.foto).then((u) => { if (u) img.src = u; }); });
  }
  function verFoto(p, titulo) {
    abrirFolha(`<h2>${esc(titulo || 'Foto')}</h2><img class="foto-grande" data-foto="${esc(p)}" alt="">
      <div class="botoes"><button class="btn" data-f="ok">Fechar</button></div>`, (f) => { pintarFotos(f); $('[data-f=ok]', f).onclick = () => fecharFolha(); });
  }

  /* ---------- código de barras (biblioteca ZXing, carregada só quando usa) ---------- */
  let zxingCarregando = null;
  function carregarZXing() {
    if (window.ZXing) return Promise.resolve();
    return (zxingCarregando = zxingCarregando || new Promise((ok, erro) => {
      const s = document.createElement('script');
      s.src = 'zxing.min.js';
      s.onload = ok;
      s.onerror = () => { zxingCarregando = null; erro(new Error('não foi possível carregar o leitor')); };
      document.head.append(s);
    }));
  }
  // Tela cheia por cima de tudo (não fecha a folha de edição que estiver aberta)
  async function lerCodigo(aoLer) {
    const camada = document.createElement('div');
    camada.className = 'leitor-tela';
    camada.innerHTML = `<h2>Ler código de barras</h2><div class="leitor"><video playsinline muted autoplay></video><div class="mira"></div></div>
      <p id="leitor-msg" style="text-align:center;color:var(--muted)">Aponte para o código de barras da embalagem</p>
      <form><input id="leitor-num" inputmode="numeric" placeholder="ou digite o número"><button class="btn primario">OK</button></form>
      <div class="botoes"><button type="button" class="btn largo" data-f="nao">Cancelar</button></div>`;
    document.body.append(camada);
    let leitor = null, acabou = false;
    const terminar = (cod) => {
      if (acabou) return;
      acabou = true;
      try { leitor && leitor.reset(); } catch (e) {}
      camada.remove();
      if (cod) aoLer(cod);
    };
    $('[data-f=nao]', camada).onclick = () => terminar();
    $('form', camada).onsubmit = (e) => { e.preventDefault(); const v = $('#leitor-num', camada).value.replace(/\D/g, ''); if (v) terminar(v); };
    try {
      await carregarZXing();
      if (acabou) return;
      const F = ZXing.BarcodeFormat;
      const dicas = new Map([[ZXing.DecodeHintType.POSSIBLE_FORMATS, [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128]]]);
      leitor = new ZXing.BrowserMultiFormatReader(dicas, 250);
      await leitor.decodeFromConstraints({ video: { facingMode: 'environment' } }, $('video', camada), (res) => { if (res) terminar(res.getText()); });
      if (acabou) try { leitor.reset(); } catch (e) {}
    } catch (e) {
      const m = $('#leitor-msg', camada);
      if (m) m.textContent = /NotAllowed|Permission/i.test((e && e.name) + (e && e.message)) ? 'Sem acesso à câmera. Libere em Ajustes do iPhone › Safari › Câmera, ou digite o número.' : 'Não foi possível abrir a câmera. Digite o número abaixo.';
    }
  }
  const produtoPorCodigo = (cod) => ativos('catalogo').find((c) => (c.codigos || []).includes(cod));
  function vincularCodigo(nome, cod) {
    const id = norm(nome);
    for (const c of ativos('catalogo').filter((x) => x.id !== id && (x.codigos || []).includes(cod)))  // um código, um produto
      Store.put('catalogo', Object.assign({}, c, { codigos: c.codigos.filter((k) => k !== cod) }));
    const atual = D().catalogo[id] || { id, nome, vezes: 0, porLista: {} };
    Store.put('catalogo', Object.assign({}, atual, { codigos: [...new Set([...(atual.codigos || []), cod])] }));
    Store.concluir();
  }
  async function nomePeloCodigo(cod) {
    // Open Food Facts: base aberta de produtos (nem todo produto brasileiro está lá)
    try {
      const ctl = new AbortController(); setTimeout(() => ctl.abort(), 5000);
      const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(cod)}.json?fields=product_name,product_name_pt,brands,quantity`, { signal: ctl.signal });
      const d = await r.json();
      const p = d && d.product;
      if (!p) return '';
      const nome = (p.product_name_pt || p.product_name || '').trim();
      const marca = (p.brands || '').split(',')[0].trim();
      return [nome, marca && !norm(nome).includes(norm(marca)) ? marca : '', p.quantity || ''].filter(Boolean).join(' ').trim();
    } catch (e) { return ''; }
  }
  function codigoLido(cod) {
    const prod = produtoPorCodigo(cod);
    if (prod) { adicionarItem(listaAtual, prod.nome); toast(`${prod.nome} na lista`); return; }
    abrirFolha(`<h2>Produto novo</h2><p style="color:var(--muted);margin-top:-6px">Código ${esc(cod)}. Da próxima vez ele entra direto.</p>
      <form><div class="campo"><label>Nome</label><input id="fn-nome" placeholder="Buscando o nome…" autocapitalize="sentences"></div>
      <div class="botoes"><button type="button" class="btn" data-f="nao">Cancelar</button><button class="btn primario">Adicionar</button></div></form>`, (f) => {
      const campo = $('#fn-nome', f);
      $('[data-f=nao]', f).onclick = () => fecharFolha();
      $('form', f).onsubmit = (e) => {
        e.preventDefault();
        const nome = campo.value.trim();
        if (!nome) return;
        fecharFolha();
        const item = adicionarItem(listaAtual, nome);
        vincularCodigo(item ? item.nome : capitalizar(nome), cod);
      };
      nomePeloCodigo(cod).then((n) => {
        if (!campo.isConnected) return;
        campo.placeholder = 'Ex.: Café Pilão 500 g';
        if (n && !campo.value) campo.value = n;
        campo.focus();
      });
    });
  }

  /* ---------- interface ---------- */
  let tela = 'listas', listaAtual = null, destacar = null;

  function toast(msg, acao, fn) {
    const t = $('#toast'), b = $('button', t);
    $('span', t).textContent = msg;
    b.classList.toggle('oculto', !acao);
    b.textContent = acao || '';
    b.onclick = () => { t.classList.remove('visivel'); fn && fn(); };
    t.classList.add('visivel');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('visivel'), acao ? 5000 : 2600);
  }

  function mostrarEstado() {
    const el = $('.estado');
    if (!el) return;
    const est = !Nuvem.configurada() || !Nuvem.sessao ? 'local' : Nuvem.sessao.expirada ? 'erro' : Nuvem.estado;
    el.className = 'estado ' + est;
    el.title = { local: 'Só neste aparelho', ok: 'Sincronizado', pendente: 'Enviando…', offline: 'Sem internet: envia quando voltar', erro: 'Erro na sincronização' }[est] || '';
    const info = $('#info-nuvem');
    if (info) info.innerHTML = textoNuvem();
  }
  function textoNuvem() {
    if (!Nuvem.configurada()) return 'Nuvem ainda não configurada: os dados ficam só neste aparelho.';
    if (!Nuvem.sessao) return 'Usando só neste aparelho.';
    if (Nuvem.sessao.expirada) return '<span style="color:var(--danger)">Sessão expirada: entre de novo.</span>';
    const t = { ok: 'Sincronizado', pendente: 'Enviando mudanças…', offline: 'Sem internet: as mudanças sobem quando voltar.', erro: 'Erro: ' + esc(Nuvem.erro), local: '' }[Nuvem.estado] || '';
    return `${esc(Nuvem.sessao.email)}<br>${t}`;
  }

  function cabecalho(titulo, { voltar, direita } = {}) {
    return `<header class="topo${voltar ? ' sub' : ''}">
      ${voltar ? `<button class="btn-icone" data-acao="voltar" aria-label="Voltar">${ICONE.voltar}</button>` : ''}
      <h1>${esc(titulo)}</h1><span class="estado" aria-hidden="true"></span>${direita || ''}</header>`;
  }
  function abas() {
    const a = (id, rot, ic) => `<button data-aba="${id}" class="${(tela === id || (id === 'listas' && tela === 'lista')) ? 'ativa' : ''}">${ICONE[ic]}${rot}</button>`;
    return `<nav class="abas">${a('listas', 'Listas', 'abaListas')}${a('historico', 'Histórico', 'abaHist')}${a('ajustes', 'Ajustes', 'abaAjustes')}</nav>`;
  }

  // render(remoto): quando chegam dados da nuvem, não redesenha telas com campos sendo digitados
  function render(remoto) {
    if (Nuvem.precisaLogin()) return telaLogin();
    if (tela === 'lista' && (!listaAtual || !D().listas[listaAtual] || D().listas[listaAtual].apagado)) tela = 'listas';
    aplicarModoMercado();
    if (remoto && tela === 'ajustes') return;
    if (tela === 'lista' && $('#campo-item')) { atualizarLista(); return; }
    document.body.classList.remove('com-rodape');
    const app = $('#app');
    if (tela === 'listas') app.innerHTML = telaListas();
    else if (tela === 'lista') { app.innerHTML = telaLista(); atualizarLista(); }
    else if (tela === 'historico') app.innerHTML = telaHistorico();
    else if (tela === 'ajustes') { app.innerHTML = telaAjustes(); atualizarAvisosUI(); }
    mostrarEstado();
  }
  function ir(t, id) { tela = t; if (id) listaAtual = id; $('#app').innerHTML = ''; render(); window.scrollTo(0, 0); }

  /* tela: listas */
  function telaListas() {
    const listas = listasOrdenadas();
    const cards = listas.map((l) => {
      const its = itensDa(l.id), falta = its.filter((i) => !i.marcado).length, car = its.length - falta;
      const det = its.length ? `${falta} ${falta === 1 ? 'item' : 'itens'} para comprar${car ? ` · ${car} no carrinho` : ''}` : 'Vazia';
      return `<button class="cartao lista-card" data-abrir="${esc(l.id)}"><span class="emoji">${esc(l.emoji || '🛒')}</span>
        <span class="info"><div class="nome">${esc(l.nome)}</div><div class="det">${det}</div>${orcHtml(l)}</span><span class="seta">›</span></button>`;
    }).join('');
    return cabecalho('Nossa Lista', { direita: `<button class="btn-icone" data-acao="nova-lista" aria-label="Nova lista">${ICONE.mais}</button>` }) +
      `<main>${faixasHtml()}<div class="listas" style="margin-top:8px">${cards}</div>
      <button class="btn largo" style="margin-top:14px" data-acao="nova-lista">${ICONE.mais.replace('<svg', '<svg width="18" height="18"')} Nova lista</button></main>` + abas();
  }

  /* tela: lista aberta */
  function telaLista() {
    const l = D().listas[listaAtual];
    return cabecalho(`${l.emoji || ''} ${l.nome}`, { voltar: true, direita: `<button class="btn-icone" data-acao="ir-mercado" aria-label="Estou no mercado">${ICONE.carrinho}</button><button class="btn-icone" data-acao="menu-lista" aria-label="Opções">${ICONE.menu}</button>` }) +
      `<main>
        <div id="faixas"></div>
        <div class="adicionar">
          <form id="form-item" autocomplete="off" style="position:relative">
            <input id="campo-item" enterkeyhint="done" placeholder="Adicionar (ex.: 2 kg arroz)" autocapitalize="sentences">
            <button type="button" class="btn lerc" data-acao="ler-codigo" aria-label="Ler código de barras">${ICONE.codigo}</button>
            <button class="btn primario" aria-label="Adicionar">${ICONE.mais.replace('<svg', '<svg width="20" height="20"')}</button>
            <div class="sugestoes oculto" id="sugestoes"></div>
          </form>
          <div class="chips" id="chips"></div>
        </div>
        <div id="conteudo"></div>
      </main>
      <div class="rodape oculto" id="rodape"></div>` + abas();
  }

  function atualizarLista() {
    const its = itensDa(listaAtual);
    const falta = its.filter((i) => !i.marcado), car = its.filter((i) => i.marcado);
    const linha = (i) => {
      const v = valorItem(i), det = detalheItem(i, true);
      // por trás do item ficam as duas ações do gesto: arrastar p/ esquerda apaga, p/ direita marca (ou desmarca)
      return `<div class="item${i.marcado ? ' marcado' : ''}${destacar === i.id ? ' novo' : ''}" data-id="${esc(i.id)}">
        <div class="fundo marcar${i.marcado ? ' desfazer' : ''} oculto-fundo">${ICONE.check}${i.marcado ? 'Desmarcar' : 'Marcar'}</div>
        <div class="fundo apagar oculto-fundo">Apagar${ICONE.lixo}</div>
        <div class="frente">
        <button class="check" data-marcar="${esc(i.id)}" aria-label="${i.marcado ? 'Desmarcar' : 'Marcar'} ${esc(i.nome)}"><span>${ICONE.check}</span></button>
        ${i.foto ? `<button class="ver-foto" data-verfoto="${esc(i.foto)}" data-titulo="${esc(i.nome)}" aria-label="Ver foto"><img class="foto" data-foto="${esc(i.foto)}" alt=""></button>` : ''}
        <button class="corpo" data-editar="${esc(i.id)}"><div class="nome">${esc(i.nome)}</div>${det ? `<div class="det">${esc(det)}</div>` : ''}</button>
        ${v != null ? `<div class="valor">${moeda(v)}</div>` : ''}
        <button class="lapis" data-editar="${esc(i.id)}" aria-label="Editar ${esc(i.nome)}">${ICONE.lapis}</button></div></div>`;
    };
    let html = '';
    if (!its.length) html = `<div class="vazio"><div class="grande">🧺</div>Lista vazia.<br>Digite acima o que precisa comprar.</div>`;
    for (const c of ordemCats(falta)) html += `<div class="grupo"><h3>${esc(c)}</h3><div class="cartao itens">${falta.filter((i) => i.cat === c || (!i.cat && c === 'Outros')).sort((a, b) => a.nome.localeCompare(b.nome)).map(linha).join('')}</div></div>`;
    if (car.length) html += `<div class="grupo"><h3>No carrinho · ${car.length}</h3><div class="cartao itens">${car.sort((a, b) => a.nome.localeCompare(b.nome)).map(linha).join('')}</div></div>`;
    $('#conteudo').innerHTML = html;
    destacar = null;
    if (its.length && !M().dicaArrastar) {  // dica única: o gesto não tem como ser descoberto sozinho
      M().dicaArrastar = true; Store.salvar();
      setTimeout(() => toast('Dica: arraste um item para a direita para marcar e para a esquerda para apagar'), 600);
    }

    // rodapé com totais
    const tCar = car.reduce((s, i) => s + (valorItem(i) || 0), 0);
    const tTudo = its.reduce((s, i) => s + (valorItem(i) || 0), 0);
    const semPreco = its.filter((i) => i.preco == null).length;
    const rod = $('#rodape');
    rod.classList.toggle('oculto', !its.length);
    document.body.classList.toggle('com-rodape', !!its.length);
    // orçamento do mês: quanto sobra (ou passa) contando o que já está no carrinho
    const l = D().listas[listaAtual];
    let orc = '';
    if (l.orcamento) {
      const resta = l.orcamento - gastoNoMes(listaAtual) - tCar;
      orc = `<small style="display:block;color:${resta < 0 ? 'var(--danger)' : 'var(--muted)'}">${resta < 0 ? `Passa ${moeda(-resta)} do orçamento` : `Orçamento: resta ${moeda(resta)}`}</small>`;
    }
    rod.innerHTML = `<div class="cartao"><div class="totais"><small>No carrinho (${car.length})</small><b>${moeda(tCar)}</b>
      <small>${tTudo ? `Lista ${moeda(tTudo)}` : ''}${tTudo && semPreco ? ' · ' : ''}${semPreco ? `${semPreco} sem preço` : ''}</small>${orc}</div>
      <button class="btn primario" data-acao="finalizar" ${car.length ? '' : 'disabled'}>Finalizar compra</button></div>`;
    $('#faixas').innerHTML = faixasHtml();
    const bm = $('[data-acao=ir-mercado]');
    if (bm) bm.classList.toggle('ativo', !!euNoMercado());
    pintarFotos($('#conteudo'));
    atualizarChips();
    mostrarEstado();
  }

  function atualizarChips() {
    const el = $('#chips');
    if (!el) return;
    const naLista = new Set(itensDa(listaAtual).filter((i) => !i.marcado).map((i) => norm(i.nome)));
    const freq = ativos('catalogo').filter((c) => (c.porLista || {})[listaAtual] && !naLista.has(c.id))
      .sort((a, b) => b.porLista[listaAtual] - a.porLista[listaAtual] || (b.ultima || 0) - (a.ultima || 0)).slice(0, 15);
    el.innerHTML = freq.map((c) => `<button class="chip" data-chip="${esc(c.nome)}"><b>+</b>${esc(c.nome)}</button>`).join('');
    el.classList.toggle('oculto', !freq.length);
  }

  function atualizarSugestoes() {
    const caixa = $('#sugestoes'), campo = $('#campo-item');
    const q = norm(lerTextoItem(campo.value).nome);
    if (q.length < 2) { caixa.classList.add('oculto'); return; }
    const naLista = new Set(itensDa(listaAtual).filter((i) => !i.marcado).map((i) => norm(i.nome)));
    const achados = ativos('catalogo').filter((c) => c.id.includes(q) && c.id !== q)
      .sort((a, b) => (b.id.startsWith(q) - a.id.startsWith(q)) || (b.vezes || 0) - (a.vezes || 0)).slice(0, 6);
    caixa.innerHTML = achados.map((c) => `<button type="button" data-sug="${esc(c.nome)}"><span>${esc(c.nome)}</span><small>${naLista.has(c.id) ? 'já na lista' : c.vezes ? `comprado ${c.vezes}×` : esc(c.cat || '')}</small></button>`).join('');
    caixa.classList.toggle('oculto', !achados.length);
  }

  /* tela: histórico */
  function telaHistorico() {
    const compras = ativos('compras').sort((a, b) => b.data - a.data);
    let html = '';
    if (!compras.length) html = `<div class="vazio"><div class="grande">🧾</div>Nenhuma compra ainda.<br>Ao tocar em <b>Finalizar compra</b> numa lista, ela aparece aqui.</div>`;
    const porMes = {};
    for (const c of compras) { const k = nomeMes(c.data); (porMes[k] = porMes[k] || []).push(c); }
    for (const [mes, lista] of Object.entries(porMes)) {
      const tot = lista.reduce((s, c) => s + (c.total || 0), 0);
      const ref = lista[0].data;
      const orcs = listasOrdenadas().filter((l) => l.orcamento).map((l) => `<div style="font-size:13.5px;margin-top:6px">${esc(l.emoji || '')} ${esc(l.nome)}</div>${orcHtml(l, ref)}`).join('');
      html += `<div class="titulo-secao">${esc(mes)}</div><div class="cartao">
        <div class="mes"><span>${lista.length} ${lista.length === 1 ? 'compra' : 'compras'}</span><b>${moeda(tot)}</b></div>
        ${orcs ? `<div class="orc-hist">${orcs}</div>` : ''}
        ${lista.map((c) => `<button class="compra" data-compra="${esc(c.id)}"><span style="font-size:24px">${esc(c.emoji || '🛒')}</span>
          <span class="info"><div>${esc(c.nomeLista)} · ${dataCurta(c.data)}</div><div class="det">${c.itens.length} ${c.itens.length === 1 ? 'item' : 'itens'}${c.por ? ' · ' + esc(c.por) : ''}${c.itens.some((i) => i.preco == null) ? ` · <span style="color:var(--accent-strong);font-weight:600">${c.itens.filter((i) => i.preco == null).length} sem preço</span>` : ''}</div></span>
          <span class="total">${moeda(c.total)}</span></button>`).join('')}</div>`;
    }
    return cabecalho('Histórico') + `<main>${html}</main>` + abas();
  }

  /* tela: ajustes */

    const nuvem = !Nuvem.configurada() ? '' : Nuvem.sessao
      ? `<button class="btn largo" style="margin-top:10px" data-acao="sincronizar">Sincronizar agora</button>
         <button class="btn largo perigo" style="margin-top:8px" data-acao="sair">Sair desta conta</button>`

      <div class="titulo-secao">Sincronização</div>
      <div class="cartao" style="padding:14px"><div id="info-nuvem" style="color:var(--muted);font-size:15px">${textoNuvem()}</div>${nuvem}</div>

      <div class="titulo-secao">Avisos no celular</div>

      <div class="titulo-secao">No mercado</div>
      <div class="cartao"><div class="linha"><div class="rot">Pedir o preço ao marcar<small>Abre o campo de preço quando você marca um item</small></div>
        <label class="chave"><input type="checkbox" id="pedir-preco" ${M().pedirPreco ? 'checked' : ''}><span></span></label></div></div>

      <div class="titulo-secao"><span>Categorias (ordem dos corredores)</span></div>
      <div class="cartao">${lc.map((c, k) => `<div class="linha"><div class="rot">${esc(c)}</div><div class="acoes">
        <button data-cat-subir="${k}" aria-label="Subir" ${k === 0 ? 'disabled style="opacity:.3"' : ''}>${ICONE.cima}</button>

        <div class="linha"><button class="btn largo" data-acao="nova-cat">${ICONE.mais.replace('<svg', '<svg width="18" height="18"')} Nova categoria</button></div></div>

      <div class="cartao" style="padding:14px;color:var(--muted);font-size:15px">No Safari, toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>. O app abre em tela cheia e funciona sem internet.</div>
      <p style="text-align:center;color:var(--muted);font-size:13px;margin-top:24px">Nossa Lista · versão ${VERSAO}</p>

  /* tela: login */
  function telaLogin() {
    document.body.classList.remove('com-rodape');
    const expirada = Nuvem.sessao && Nuvem.sessao.expirada;
    $('#app').innerHTML = `<div class="login"><img src="icon-192.png" alt=""><h1>Nossa Lista</h1>

      <form id="form-login"><input type="email" id="login-email" placeholder="E-mail" autocomplete="username" value="${esc(Nuvem.sessao ? Nuvem.sessao.email : '')}" required>
        <input type="password" id="login-senha" placeholder="Senha" autocomplete="current-password" required>
        <div class="erro" id="login-erro"></div><button class="btn primario largo">Entrar</button></form>
      <button class="link" data-acao="so-aparelho">Usar só neste aparelho por enquanto</button></div>`;
