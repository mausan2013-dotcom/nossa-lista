  /* ---------- folha (bottom sheet) ---------- */
  function abrirFolha(html, aoMontar) {
    fecharFolha(true);
    const veu = document.createElement('div'); veu.className = 'veu';
    const f = document.createElement('div'); f.className = 'folha'; f.setAttribute('role', 'dialog');
    f.innerHTML = `<div class="folha-topo"><div class="puxador"></div><button type="button" class="folha-x" aria-label="Fechar">${ICONE.x}</button></div>` + html;
    document.body.append(veu, f);
    veu.onclick = () => fecharFolha();
    $('.folha-x', f).onclick = () => fecharFolha();
    requestAnimationFrame(() => { veu.classList.add('aberto'); f.classList.add('aberta'); });
    aoMontar && aoMontar(f);
    return f;
  }
  function fecharFolha(ja) {
    const f = $('.folha'), v = $('.veu');
    if (!f) return;
    if (ja) { f.remove(); v && v.remove(); return; }
    f.classList.remove('aberta'); v && v.classList.remove('aberto');
    setTimeout(() => { f.remove(); v && v.remove(); }, 250);
  }
  function confirmar(titulo, texto, rotulo, fn, perigo = true) {
    abrirFolha(`<h2>${esc(titulo)}</h2><p style="color:var(--muted);margin-top:-6px">${texto}</p>
      <div class="botoes"><button class="btn" data-f="nao">Cancelar</button><button class="btn ${perigo ? 'perigo' : 'primario'}" data-f="sim" style="${perigo ? 'background:var(--surface-2)' : ''}">${esc(rotulo)}</button></div>`, (f) => {
      $('[data-f=nao]', f).onclick = () => fecharFolha();
      $('[data-f=sim]', f).onclick = () => { fecharFolha(); fn(); };
    });
  }
  function pedirTexto(titulo, valor, rotulo, fn) {
    abrirFolha(`<h2>${esc(titulo)}</h2><form><input id="f-texto" value="${esc(valor || '')}" autocapitalize="sentences">
      <div class="botoes"><button type="button" class="btn" data-f="nao">Cancelar</button><button class="btn primario">${esc(rotulo)}</button></div></form>`, (f) => {
      $('[data-f=nao]', f).onclick = () => fecharFolha();
      $('form', f).onsubmit = (e) => { e.preventDefault(); const v = $('#f-texto', f).value.trim(); if (!v) return; fecharFolha(); fn(v); };
      setTimeout(() => $('#f-texto', f).focus(), 50);
    });
  }

  function abrirItem(id) {
    const i = D().itens[id];
    if (!i) return;
    const opCats = [...new Set([...cats(), i.cat || 'Outros'])].map((c) => `<option ${c === i.cat ? 'selected' : ''}>${esc(c)}</option>`).join('');
    const opUn = [...new Set([...UNIDADES, i.un || 'un'])].map((u) => `<option ${u === (i.un || 'un') ? 'selected' : ''}>${esc(u)}</option>`).join('');
    const opListas = listasOrdenadas().map((l) => `<option value="${esc(l.id)}" ${l.id === i.lista ? 'selected' : ''}>${esc(l.emoji || '')} ${esc(l.nome)}</option>`).join('');
    const quem = [i.por ? `Adicionado por ${i.por}` : '', i.marcado && i.marcadoPor ? `marcado por ${i.marcadoPor}` : ''].filter(Boolean).join(' · ');
    abrirFolha(`<h2>Editar item</h2><form id="f-item">
      <div class="campo"><label>Nome</label><input id="fi-nome" value="${esc(i.nome)}" autocapitalize="sentences"></div>
      <div class="dupla">
        <div class="campo"><label>Quantidade</label><div class="qtd"><button type="button" data-q="-1">−</button><input id="fi-qtd" inputmode="decimal" value="${esc(fmtNum(i.qtd))}" placeholder="—"><button type="button" data-q="1">+</button></div></div>
        <div class="campo"><label>Unidade</label><select id="fi-un">${opUn}</select></div>
      </div>
      <div class="dupla">
        <div class="campo"><label id="fi-rot-preco">${rotuloPreco(i.un)}</label><input id="fi-preco" inputmode="decimal" placeholder="R$ 0,00" value="${i.preco != null ? esc(fmtNum(i.preco)) : ''}"></div>
        <div class="campo"><label>Categoria</label><select id="fi-cat">${opCats}</select></div>
      </div>
      <div class="campo"><label>Observação</label><input id="fi-obs" value="${esc(i.obs || '')}" placeholder="Ex.: marca X, sem lactose" autocapitalize="sentences"></div>
      <div class="campo"><label>Lista</label><select id="fi-lista">${opListas}</select></div>
      <div class="campo"><label>Foto</label><div class="foto-campo" id="fi-foto-area"></div></div>
      <div class="campo"><label>Código de barras</label><div class="foto-campo"><span id="fi-cods" style="color:var(--muted);font-size:14px;flex:1"></span>
        <button type="button" class="btn" data-f="vincular">${ICONE.codigo.replace('<svg', '<svg width="20" height="20"')} Ler</button></div></div>
      ${quem ? `<p style="color:var(--muted);font-size:13px;margin:0 2px">${esc(quem)}</p>` : ''}
      <div class="botoes"><button type="button" class="btn perigo" data-f="apagar">Excluir</button><button class="btn primario">Salvar</button></div></form>`, (f) => {
      // foto: tirada agora fica no aparelho e sobe para a nuvem na sincronização
      let foto = i.foto || null;
      const desenharFoto = () => {
        $('#fi-foto-area', f).innerHTML = `${foto ? `<img data-foto="${esc(foto)}" alt="">` : ''}
          <label class="btn">📷 ${foto ? 'Trocar' : 'Adicionar foto'}<input type="file" accept="image/*" class="oculto" id="fi-arquivo"></label>
          ${foto ? '<button type="button" class="btn perigo" data-f="sem-foto">Tirar</button>' : ''}`;
        pintarFotos(f);
        $('#fi-arquivo', f).onchange = async (e) => {
          const arq = e.target.files[0];
          if (!arq) return;
          try { foto = await Fotos.nova(arq); desenharFoto(); }
          catch (x) { toast('Não foi possível usar esta foto'); }
        };
        const sem = $('[data-f=sem-foto]', f);
        if (sem) sem.onclick = () => { foto = null; desenharFoto(); };
      };
      desenharFoto();
      const desenharCods = () => {
        const c = D().catalogo[norm(i.nome)];
        const cods = (c && c.codigos) || [];
        $('#fi-cods', f).textContent = cods.length ? cods.join(', ') : 'Nenhum: leia para o item entrar direto da próxima vez';
      };
      desenharCods();
      $('[data-f=vincular]', f).onclick = () => {
        const nomeAtual = $('#fi-nome', f).value.trim() || i.nome;
        lerCodigo((cod) => { vincularCodigo(nomeAtual, cod); desenharCods(); toast(`Código ${cod} ligado a ${nomeAtual}`); });
      };
      $$('[data-q]', f).forEach((b) => (b.onclick = () => {
        const passo = ['kg', 'L'].includes($('#fi-un', f).value) ? 0.5 : ['g', 'ml'].includes($('#fi-un', f).value) ? 100 : 1;
        const atual = numero($('#fi-qtd', f).value);
        const n = Math.max(0, Math.round(((atual == null ? (b.dataset.q > 0 ? 0 : 1) : atual) + passo * b.dataset.q) * 1000) / 1000);
        $('#fi-qtd', f).value = n ? fmtNum(n) : '';
      }));
      $('#fi-un', f).onchange = () => { $('#fi-rot-preco', f).textContent = rotuloPreco($('#fi-un', f).value); };
      $('[data-f=apagar]', f).onclick = () => { fecharFolha(); apagarItem(id); };
      $('#f-item', f).onsubmit = (e) => {
        e.preventDefault();
        const nome = $('#fi-nome', f).value.trim();
        if (!nome) return;
        const atual = D().itens[id];
        const novo = Object.assign({}, atual, {
          nome, qtd: numero($('#fi-qtd', f).value), un: $('#fi-un', f).value, preco: numero($('#fi-preco', f).value),
          cat: $('#fi-cat', f).value, obs: $('#fi-obs', f).value.trim(), lista: $('#fi-lista', f).value, foto
        });
        if (novo.qtd === 0) novo.qtd = null;
        Store.put('itens', novo);
        lembrarProduto(novo, false);
        Store.concluir();
        fecharFolha();
        render();
        if (novo.lista !== atual.lista) toast(`Movido para ${D().listas[novo.lista].nome}`);
      };
    });
  }

  function abrirPreco(id) {
    const i = D().itens[id];
    abrirFolha(`<h2>${esc(i.nome)}</h2><form><div class="campo"><label>${rotuloPreco(i.un)}</label>
      <input id="fp-preco" inputmode="decimal" placeholder="R$ 0,00" value="${i.preco != null ? esc(fmtNum(i.preco)) : ''}"></div>
      <div class="botoes"><button type="button" class="btn" data-f="pular">Pular</button><button class="btn primario">Salvar preço</button></div></form>`, (f) => {
      $('[data-f=pular]', f).onclick = () => fecharFolha();
      $('form', f).onsubmit = (e) => {
        e.preventDefault();
        const novo = Object.assign({}, D().itens[id], { preco: numero($('#fp-preco', f).value) });
        Store.put('itens', novo); lembrarProduto(novo, false); Store.concluir(); fecharFolha(); render();
      };
      setTimeout(() => { const c = $('#fp-preco', f); c.focus(); c.select(); }, 60);
    });
  }

  function abrirLista(id) {
    const l = id ? D().listas[id] : { nome: '', emoji: '🛒' };
    let emoji = l.emoji || '🛒';
    abrirFolha(`<h2>${id ? 'Editar lista' : 'Nova lista'}</h2><form>
      <div class="campo"><label>Nome</label><input id="fl-nome" value="${esc(l.nome)}" placeholder="Ex.: Churrasco, Casa" autocapitalize="sentences"></div>
      <div class="campo"><label>Ícone</label><div class="emojis">${EMOJIS.map((e) => `<button type="button" data-emoji="${e}" class="${e === emoji ? 'sel' : ''}">${e}</button>`).join('')}</div></div>
      <div class="campo"><label>Orçamento do mês (opcional)</label><input id="fl-orc" inputmode="decimal" placeholder="Ex.: 1.500,00" value="${l.orcamento ? esc(fmtNum(l.orcamento)) : ''}"></div>
      <div class="botoes"><button type="button" class="btn" data-f="nao">Cancelar</button><button class="btn primario">${id ? 'Salvar' : 'Criar lista'}</button></div></form>`, (f) => {
      $$('[data-emoji]', f).forEach((b) => (b.onclick = () => { emoji = b.dataset.emoji; $$('[data-emoji]', f).forEach((x) => x.classList.toggle('sel', x === b)); }));
      $('[data-f=nao]', f).onclick = () => fecharFolha();
      $('form', f).onsubmit = (e) => {
        e.preventDefault();
        const nome = $('#fl-nome', f).value.trim();
        if (!nome) return;
        const ordem = id ? l.ordem : Math.max(0, ...listasOrdenadas().map((x) => x.ordem || 0)) + 1;
        const orcamento = numero($('#fl-orc', f).value) || null;
        const nova = Store.put('listas', Object.assign({}, id ? l : { id: uid() }, { nome, emoji, ordem, orcamento }));
        Store.concluir(); fecharFolha();
        if (id) render(); else ir('lista', nova.id);
      };
      if (!id) setTimeout(() => $('#fl-nome', f).focus(), 60);
    });
  }

  function menuLista() {
    const l = D().listas[listaAtual];
    const its = itensDa(listaAtual), car = its.filter((i) => i.marcado);
    abrirFolha(`<h2>${esc(l.emoji || '')} ${esc(l.nome)}</h2><div class="menu">
      <button data-m="compartilhar">📤 Enviar a lista (WhatsApp, Mensagens…)</button>
      <button data-m="editar">✏️ Renomear, ícone e orçamento</button>
      ${car.length ? '<button data-m="desmarcar">↩️ Desmarcar todos</button><button data-m="tirar">🧹 Tirar os marcados sem guardar no histórico</button>' : ''}
      ${its.length ? '<button data-m="limpar" class="perigo">🗑️ Esvaziar a lista</button>' : ''}
      <button data-m="apagar" class="perigo">❌ Excluir a lista</button></div>`, (f) => {
      const op = {
        compartilhar() {
          const t = textoDaLista(listaAtual);
          if (navigator.share) navigator.share({ text: t }).catch(() => {});
          else navigator.clipboard.writeText(t).then(() => toast('Lista copiada'));
        },
        editar() { abrirLista(listaAtual); },
        desmarcar() { for (const i of car) Store.put('itens', Object.assign({}, i, { marcado: false })); Store.concluir(); render(); },
        tirar() { for (const i of car) Store.put('itens', Object.assign({}, i, { apagado: true })); Store.concluir(); render(); },
        limpar() { confirmar('Esvaziar a lista?', `Os ${its.length} itens saem da lista (não vão para o histórico).`, 'Esvaziar', () => { for (const i of its) Store.put('itens', Object.assign({}, i, { apagado: true })); Store.concluir(); render(); }); },
        apagar() {
          confirmar(`Excluir "${l.nome}"?`, 'A lista e os itens dela somem dos dois celulares. O histórico de compras continua.', 'Excluir', () => {
            for (const i of its) Store.put('itens', Object.assign({}, i, { apagado: true }));
            Store.put('listas', Object.assign({}, l, { apagado: true })); Store.concluir(); ir('listas');
          });
        }
      };
      $$('[data-m]', f).forEach((b) => (b.onclick = () => { fecharFolha(true); op[b.dataset.m](); }));
    });
  }

  // Editar compra feita: dá para preencher/corrigir preços e quantidades em casa, tirar ou incluir itens e mudar a data.
  // Tudo é feito numa cópia e só vale ao tocar em "Salvar alterações".
  const precoTxt = (n) => (n == null ? '' : n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 3 }));
  const dataIso = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const totalItens = (its) => its.reduce((s, i) => s + (valorItem(i) || 0), 0);
  // o preço do catálogo (usado nos itens novos) acompanha a compra mais recente do produto
  function precosNoCatalogo(compraId, itens) {
    const c = D().compras[compraId];
    const maisNovas = ativos('compras').filter((x) => x.id !== compraId && x.data > c.data);
    for (const i of itens) {
      const id = norm(i.nome), cat = D().catalogo[id];
      if (i.preco == null || !cat || cat.preco === i.preco) continue;
      if (maisNovas.some((x) => x.itens.some((y) => norm(y.nome) === id))) continue;
      Store.put('catalogo', Object.assign({}, cat, { preco: i.preco }));
    }
  }
  function abrirCompra(id) {
    const c = D().compras[id];
    const itens = c.itens.map((i) => Object.assign({}, i));
    const destinos = listasOrdenadas();
    const destino = destinos.find((l) => l.id === c.lista) ? c.lista : (destinos[0] || {}).id;
    const porUn = (un) => (un === 'g' ? 'kg' : un === 'ml' ? 'L' : un || 'un');
    const valorTxt = (i) => { const v = valorItem(i); return v != null ? moeda(v) : '—'; };
    abrirFolha(`<h2>${esc(c.emoji || '')} ${esc(c.nomeLista)} · ${new Date(c.data).toLocaleDateString('pt-BR')}</h2>
      <p style="color:var(--muted);margin:-6px 0 10px;font-size:14.5px">Preencha ou corrija os preços (o preço é por unidade, kg ou litro, como na etiqueta).</p>
      <div class="campo"><label>Data da compra</label><input type="date" id="fc-data" value="${dataIso(c.data)}"></div>
      <div id="fc-itens"></div>
      <div class="cp-total" id="fc-total"></div>
      <form id="fc-add" style="display:flex;gap:8px;margin-top:6px" autocomplete="off"><input id="fc-novo" placeholder="Esqueceu um item? Ex.: 2 kg tomate" autocapitalize="sentences"><button class="btn" style="flex:none">Incluir</button></form>
      ${c.por ? `<p style="color:var(--muted);font-size:13px;margin:10px 2px 0">Finalizada por ${esc(c.por)}${c.editadaPor ? ` · editada por ${esc(c.editadaPor)}` : ''}</p>` : ''}
      <div class="botoes"><button class="btn primario" data-f="salvar">Salvar alterações</button></div>
      ${destino ? `<div class="campo" style="margin-top:18px"><label>Colocar estes itens de novo numa lista</label><div style="display:flex;gap:8px"><select id="fc-lista">${destinos.map((l) => `<option value="${esc(l.id)}" ${l.id === destino ? 'selected' : ''}>${esc(l.emoji || '')} ${esc(l.nome)}</option>`).join('')}</select><button type="button" class="btn" style="flex:none" data-f="repetir">Repetir</button></div></div>` : ''}
      <div class="botoes"><button class="btn perigo" data-f="apagar">Excluir esta compra</button></div>`, (f) => {
      const totais = () => {
        const sem = itens.filter((i) => i.preco == null).length;
        $('#fc-total', f).innerHTML = `<span>Total${sem ? ` <small>· ${sem} sem preço</small>` : ''}</span><b>${moeda(totalItens(itens))}</b>`;
      };
      const desenhar = () => {
        $('#fc-itens', f).innerHTML = itens.map((i, k) => `<div class="cp-linha"><div class="cp-topo"><span class="cp-nome">${esc(i.nome)}</span>
          <button type="button" class="cp-x" data-rm="${k}" aria-label="Tirar ${esc(i.nome)} da compra">${ICONE.lixo}</button></div>
          <div class="cp-campos"><input class="cp-qtd" data-k="${k}" data-c="qtd" inputmode="decimal" placeholder="1" value="${esc(fmtNum(i.qtd))}"><span class="cp-un">${esc(i.un || 'un')}</span><span class="cp-mult">×</span>
          <input class="cp-preco${i.preco == null ? ' falta' : ''}" data-k="${k}" data-c="preco" inputmode="decimal" placeholder="R$ por ${esc(porUn(i.un))}" value="${esc(precoTxt(i.preco))}">
          <span class="cp-val" data-val="${k}">${valorTxt(i)}</span></div></div>`).join('');
        totais();
      };
      desenhar();
      f.addEventListener('input', (e) => {
        const t = e.target;
        if (!t.dataset || t.dataset.k == null) return;
        const i = itens[+t.dataset.k];
        i[t.dataset.c] = t.dataset.c === 'qtd' ? numero(t.value) || null : numero(t.value);
        $(`[data-val="${t.dataset.k}"]`, f).textContent = valorTxt(i);
        if (t.dataset.c === 'preco') t.classList.toggle('falta', i.preco == null);
        totais();
      });
      f.addEventListener('click', (e) => {
        const b = e.target.closest('[data-rm]');
        if (b) { itens.splice(+b.dataset.rm, 1); desenhar(); }
      });
      $('#fc-add', f).onsubmit = (e) => {
        e.preventDefault();
        const lido = lerTextoItem($('#fc-novo', f).value);
        if (!lido.nome) return;
        const nome = capitalizar(lido.nome), cat = D().catalogo[norm(nome)];
        itens.push({ nome: cat ? cat.nome : nome, cat: palpiteCategoria(nome), qtd: lido.qtd != null ? lido.qtd : null, un: lido.un || (cat && cat.un) || 'un', preco: cat && cat.preco != null ? cat.preco : null, obs: '' });
        $('#fc-novo', f).value = '';
        desenhar();
      };
      $('[data-f=salvar]', f).onclick = () => {
        if (!itens.length) return toast('A compra precisa ter ao menos um item. Para tirar tudo, use Excluir.');
        const total = totalItens(itens);
        let data = c.data;
        const novaData = $('#fc-data', f).value;
        if (novaData && novaData !== dataIso(c.data)) {  // muda o dia e mantém a hora
          const [y, m, d] = novaData.split('-').map(Number), h = new Date(c.data);
          data = new Date(y, m - 1, d, h.getHours(), h.getMinutes()).getTime();
        }
        Store.put('compras', Object.assign({}, c, { itens, total, data, editada: Date.now(), editadaPor: meuNome() }));
        precosNoCatalogo(id, itens);
        Store.concluir(); fecharFolha(); render();
        toast(`Compra atualizada · ${moeda(total)}`);
      };
      $('[data-f=apagar]', f).onclick = () => confirmar('Excluir do histórico?', 'Esta compra some do histórico nos dois celulares.', 'Excluir', () => { Store.put('compras', Object.assign({}, c, { apagado: true })); Store.concluir(); render(); });
      const r = $('[data-f=repetir]', f);
      if (r) r.onclick = () => { const lid = $('#fc-lista', f).value; const n = repetirCompra(id, lid, itens); fecharFolha(); toast(n ? `${n} ${n === 1 ? 'item adicionado' : 'itens adicionados'}` : 'Todos já estavam na lista'); ir('lista', lid); };
    });
  }

  /* ---------- categorias ---------- */
  function salvarCats(lista) { Store.put('config', Object.assign({}, D().config.cats, { lista })); Store.concluir(); render(); }
  function moverCat(k, d) { const l = cats().slice(); [l[k], l[k + d]] = [l[k + d], l[k]]; salvarCats(l); }
  function renomearCat(k) {
    const antigo = cats()[k];
    pedirTexto('Renomear categoria', antigo, 'Salvar', (novo) => {
      if (cats().includes(novo) && novo !== antigo) return toast('Já existe essa categoria');
      const l = cats().slice(); l[k] = novo;
      for (const i of ativos('itens').filter((x) => x.cat === antigo)) Store.put('itens', Object.assign({}, i, { cat: novo }));
      for (const c of ativos('catalogo').filter((x) => x.cat === antigo)) Store.put('catalogo', Object.assign({}, c, { cat: novo }));
      salvarCats(l);
    });
  }
  function apagarCat(k) {
    const nome = cats()[k];
    confirmar(`Remover "${nome}"?`, 'Os itens desta categoria passam para "Outros".', 'Remover', () => {
      for (const i of ativos('itens').filter((x) => x.cat === nome)) Store.put('itens', Object.assign({}, i, { cat: 'Outros' }));
      for (const c of ativos('catalogo').filter((x) => x.cat === nome)) Store.put('catalogo', Object.assign({}, c, { cat: 'Outros' }));
      salvarCats(cats().filter((c) => c !== nome));
    });
  }

  /* ---------- backup ---------- */
  function exportar() {
    const blob = new Blob([JSON.stringify({ app: 'nossa-lista', versao: VERSAO, data: Date.now(), dados: D() })], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `nossa-lista-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  function restaurar(arquivo) {
    const r = new FileReader();
    r.onload = () => {
      let d; try { d = JSON.parse(r.result); } catch (e) { return toast('Arquivo inválido'); }
      if (!d || d.app !== 'nossa-lista' || !d.dados) return toast('Não é uma cópia da Nossa Lista');
      confirmar('Restaurar a cópia?', 'Os registros da cópia são juntados aos daqui (vale o mais recente de cada um).', 'Restaurar', () => {
        for (const col of COLECOES) for (const o of Object.values(d.dados[col] || {})) {
          const atual = D()[col][o.id];
          if (!atual || (o.atualizado || 0) > (atual.atualizado || 0)) D()[col][o.id] = o;
        }
        Store.concluir(); render(); toast('Cópia restaurada');
      }, false);
    };
    r.readAsText(arquivo);
  }

  /* ---------- arrastar o item: direita marca/desmarca, esquerda apaga ----------
     O item tem touch-action: pan-y, então a rolagem vertical segue normal e só o gesto horizontal chega aqui.
     Apagar tem "Desfazer" (apagarItem). Começar colado na borda esquerda é o gesto de voltar do iPhone: ignora. */
  let bloqueioClique = 0;
  document.addEventListener('click', (e) => { if (Date.now() < bloqueioClique) { e.stopPropagation(); e.preventDefault(); } }, true);
  (() => {
    const LIMITE = 84;
    let g = null;
    document.addEventListener('pointerdown', (e) => {
      const frente = e.target.closest('.item .frente');
      if (!frente || (e.pointerType === 'mouse' && e.button !== 0) || e.clientX < 24) return;
      g = { frente, item: frente.parentElement, id: frente.parentElement.dataset.id, x: e.clientX, y: e.clientY, ponteiro: e.pointerId, horizontal: false, dx: 0 };
    });
    document.addEventListener('pointermove', (e) => {
      if (!g || e.pointerId !== g.ponteiro) return;
      const dx = e.clientX - g.x, dy = e.clientY - g.y;
      if (!g.horizontal) {
        if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { g = null; return; }  // é rolagem
        if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
        g.horizontal = true;
        g.frente.classList.remove('solto');
        try { g.frente.setPointerCapture(e.pointerId); } catch (x) { /* segue sem captura */ }
      }
      g.dx = dx;
      g.frente.style.transform = `translateX(${dx}px)`;
      $('.fundo.marcar', g.item).classList.toggle('oculto-fundo', dx <= 0);
      $('.fundo.apagar', g.item).classList.toggle('oculto-fundo', dx >= 0);
    });
    const soltar = (e) => {
      if (!g || e.pointerId !== g.ponteiro) return;
      const { frente, id, dx, horizontal } = g;
      g = null;
      if (!horizontal) return;
      bloqueioClique = Date.now() + 350;  // o toque que termina o arrasto não pode abrir a edição
      frente.classList.add('solto');
      if (e.type === 'pointerup' && dx <= -LIMITE) {
        frente.style.transform = 'translateX(-105%)';
        setTimeout(() => apagarItem(id), 170);
      } else if (e.type === 'pointerup' && dx >= LIMITE) {
        frente.style.transform = '';
        alternarItem(id);
      } else frente.style.transform = '';
    };
    document.addEventListener('pointerup', soltar);
    document.addEventListener('pointercancel', soltar);
  })();

  /* ---------- eventos ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, [data-abrir]');
    if (!t) {
      if (!e.target.closest('#form-item')) { const s = $('#sugestoes'); s && s.classList.add('oculto'); }
      return;
    }
    const d = t.dataset;
    if (d.aba) return ir(d.aba);
    if (d.abrir) return ir('lista', d.abrir);
    if (d.marcar) return alternarItem(d.marcar);
    // no modo mercado, tocar no nome já marca; o lápis abre a edição
    if (d.editar) return document.body.classList.contains('modo-mercado') && t.classList.contains('corpo') ? alternarItem(d.editar) : abrirItem(d.editar);
    if (d.verfoto) return verFoto(d.verfoto, d.titulo);
    if (d.compra) return abrirCompra(d.compra);
    if (d.chip) { adicionarItem(listaAtual, d.chip); return; }
    if (d.sug) { $('#campo-item').value = ''; $('#sugestoes').classList.add('oculto'); adicionarItem(listaAtual, d.sug); $('#campo-item').focus(); return; }
    if (d.catSubir) return moverCat(+d.catSubir, -1);
    if (d.catDescer) return moverCat(+d.catDescer, 1);
    if (d.catEditar) return renomearCat(+d.catEditar);
    if (d.catApagar) return apagarCat(+d.catApagar);
    switch (d.acao) {
      case 'voltar': return ir('listas');
      case 'nova-lista': return abrirLista();
      case 'menu-lista': return menuLista();
      case 'finalizar': {
        const car = itensDa(listaAtual).filter((i) => i.marcado), falta = itensDa(listaAtual).length - car.length;
        const tot = car.reduce((s, i) => s + (valorItem(i) || 0), 0);
        return confirmar('Finalizar compra?', `${car.length} ${car.length === 1 ? 'item' : 'itens'} no carrinho · <b>${moeda(tot)}</b>.<br>Eles vão para o histórico${falta ? ` e os ${falta} não marcados continuam na lista` : ''}.`, 'Finalizar', () => finalizarCompra(listaAtual), false);
      }
      case 'nova-cat': return pedirTexto('Nova categoria', '', 'Adicionar', (v) => { if (cats().includes(v)) return toast('Já existe'); const l = cats().slice(); l.splice(Math.max(0, l.indexOf('Outros')), 0, v); salvarCats(l); });
      case 'exportar': return exportar();
      case 'sincronizar': Nuvem.sincronizar().then(() => toast(Nuvem.estado === 'ok' ? 'Sincronizado' : Nuvem.erro || 'Sem internet')); return;
      case 'sair': return confirmar('Sair desta conta?', 'A lista continua neste aparelho, mas para de sincronizar até você entrar de novo.', 'Sair', () => { Nuvem.sair(); try { localStorage.setItem('nossalista_modo', 'local'); } catch (x) {} render(); });
      case 'entrar': try { localStorage.removeItem('nossalista_modo'); } catch (x) {} return render();
      case 'so-aparelho': try { localStorage.setItem('nossalista_modo', 'local'); } catch (x) {} if (Nuvem.sessao) Nuvem.sair(); return ir('listas');
      case 'ir-mercado': return abrirIrMercado();
      case 'sair-mercado': return sairMercado();
      case 'ler-codigo': return lerCodigo(codigoLido);
      case 'ativar-avisos':
        t.disabled = true;
        Avisos.ativar().then(() => { toast('Avisos ligados'); atualizarAvisosUI(); })
          .catch((x) => { t.disabled = false; toast(x.message || 'Não foi possível ligar os avisos'); atualizarAvisosUI(); });
        return;
      case 'testar-avisos':
        t.disabled = true;
        Avisos.registrar().then(() => Avisos.chamar({ tipo: 'teste', titulo: 'Nossa Lista', corpo: 'Aviso de teste: está funcionando ✓', tag: 'teste', teste: true }))
          .then(async (r) => {
            const d2 = await r.json().catch(() => ({}));
            toast(r.ok ? (d2.enviados ? 'Aviso de teste enviado' : d2.alvos ? 'O envio falhou: confira os segredos VAPID_PUBLICA e VAPID_PRIVADA no Supabase' : 'Este celular não está cadastrado: desligue e ative os avisos de novo')
              : r.status === 404 ? 'Falta criar a função nl-avisar no Supabase' : 'Erro: ' + (d2.detalhe || d2.erro || r.status));
          })
          .catch(() => toast('Sem internet'))
          .finally(() => { t.disabled = false; });
        return;
      case 'desligar-avisos': return confirmar('Desligar os avisos?', 'Este celular para de receber avisos da lista.', 'Desligar', () => Avisos.desligar().then(atualizarAvisosUI, atualizarAvisosUI));
    }
  });

  document.addEventListener('submit', async (e) => {
    if (e.target.id === 'form-item') {
      e.preventDefault();
      const c = $('#campo-item');
      const v = c.value.trim();
      if (!v) return;
      c.value = '';
      $('#sugestoes').classList.add('oculto');
      adicionarItem(listaAtual, v);
      c.focus();
    }
    if (e.target.id === 'form-login') {
      e.preventDefault();
      const erro = $('#login-erro'), botao = $('button', e.target);
      erro.textContent = ''; botao.disabled = true; botao.textContent = 'Entrando…';
      try {
        const email = $('#login-email').value.trim().toLowerCase();
        if (Nuvem.sessao && Nuvem.sessao.email && Nuvem.sessao.email !== email) Nuvem.sair();
        await Nuvem.auth({ email, password: $('#login-senha').value }, 'password');
        try { localStorage.removeItem('nossalista_modo'); } catch (x) {}
        Nuvem.membroOk = false;
        ir('listas');
        Nuvem.sincronizar();
      } catch (x) {
        erro.textContent = x instanceof TypeError ? 'Sem internet.' : /invalid/i.test(x.message) ? 'E-mail ou senha incorretos.' : x.message;
        botao.disabled = false; botao.textContent = 'Entrar';
      }
    }
  });

  document.addEventListener('input', (e) => {
    if (e.target.id === 'campo-item') atualizarSugestoes();
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'meu-nome') { M().nome = e.target.value.trim(); Store.salvar(); toast('Nome salvo'); Avisos.registrar().catch(() => {}); }
    if (e.target.dataset && e.target.dataset.pref) {
      M().avisoPrefs = Object.assign(Avisos.prefs(), { [e.target.dataset.pref]: e.target.checked });
      Store.salvar();
      Avisos.registrar().catch(() => toast('Sem internet: a escolha vale quando voltar'));
    }
    if (e.target.id === 'pedir-preco') { M().pedirPreco = e.target.checked; Store.salvar(); }
    if (e.target.id === 'arquivo-backup' && e.target.files[0]) { restaurar(e.target.files[0]); e.target.value = ''; }
  });

  // Atualização "ao vivo": com o app aberto, confere a nuvem a cada 4 s (uma consulta leve)
  setInterval(() => { if (document.visibilityState === 'visible' && !Nuvem.rodando) Nuvem.sincronizar(); }, 4000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { Nuvem.agendar(50); aplicarModoMercado(); }
    else if (Object.keys(M().avisoItens || {}).length) AvisoItens.soltar(true);  // fechou o app: avisa já o que foi adicionado
  });
  window.addEventListener('online', () => Nuvem.agendar(50));
  window.addEventListener('offline', () => { Nuvem.estado = 'offline'; mostrarEstado(); });
  window.addEventListener('storage', (e) => { if (e.key === CHAVE) { Store.carregar(); render(true); } });

  /* ---------- início ---------- */
  Store.carregar();
  Nuvem.carregar();
  if (Nuvem.ativa()) Nuvem.estado = 'pendente';
  // aberto pelo toque num aviso: vai direto para a lista (?lista=id)
  const pedida = new URLSearchParams(location.search).get('lista');
  if (pedida && D().listas[pedida] && !D().listas[pedida].apagado) { tela = 'lista'; listaAtual = pedida; }
  if (pedida) history.replaceState(null, '', location.pathname);
  render();
  Nuvem.agendar(50);
  if (Object.keys(M().avisoItens || {}).length) AvisoItens.soltar();
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
    if (Nuvem.ativa()) Avisos.registrar().catch(() => {});  // mantém nome e preferências em dia na nuvem
  }
  </script>
</body>
</html>
